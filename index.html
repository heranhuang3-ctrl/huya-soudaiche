    function xpThreshold(level) {
      return level >= MAX_LEVEL ? Infinity : 120 + Math.max(0, level - 1) * 80;
    }

    function statBonus(value) {
      return Math.floor((value - 20) / 2);
    }

    function armorReducedDamage(attack, armor) {
      return Math.max(1, Math.floor(attack * (1 - armor / (armor + 100))));
    }

    function levelBaseStats(level = state.meta.level) {
      return LEVEL_BASE_STATS[clamp(level, 1, MAX_LEVEL)];
    }

    function gearPackage(stat, value) {
      return gearPackages[stat].find((item) => value <= item.max) || gearPackages[stat].at(-1);
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function diceProbability(target) {
      const outcomes = Array.from({ length: 6 }, (_, first) =>
        Array.from({ length: 6 }, (_, second) => first + second + 2)
      ).flat();
      return outcomes.filter((sum) => sum <= target).length / outcomes.length * 100;
    }

    function diceTargetFromPercent(percent) {
      let bestTarget = 7;
      let bestDistance = Number.POSITIVE_INFINITY;
      for (let target = 2; target <= 12; target += 1) {
        const distance = Math.abs(diceProbability(target) - percent);
        if (distance < bestDistance) {
          bestTarget = target;
          bestDistance = distance;
        }
      }
      return bestTarget;
    }

    function diceRuleText(percent) {
      const target = diceTargetFromPercent(percent);
      return `2D6 ≤ ${target}（约 ${diceProbability(target).toFixed(1)}%）`;
    }

    function checkRuleText(check) {
      return `骰子结果：${diceResultText(check)}`;
    }

    function diceResultText(check) {
      return `${check.die1}+${check.die2}=${check.sum}`;
    }

    function diceFaceMarkup(value, extraClass = "") {
      const pipPositions = {
        1: [5],
        2: [1, 9],
        3: [1, 5, 9],
        4: [1, 3, 7, 9],
        5: [1, 3, 5, 7, 9],
        6: [1, 3, 4, 6, 7, 9]
      }[value] || [];
      return `
        <div class="die die-face ${extraClass}" aria-label="${value}点骰子">
          ${Array.from({ length: 9 }, (_, index) => `<i class="${pipPositions.includes(index + 1) ? "pip" : ""}"></i>`).join("")}
        </div>
      `;
    }

    function rollCheck(targetPercent) {
      const die1 = Math.floor(Math.random() * 6) + 1;
      const die2 = Math.floor(Math.random() * 6) + 1;
      const sum = die1 + die2;
      const target = diceTargetFromPercent(targetPercent);
      const probability = diceProbability(target);
      const result = sum === 12
        ? "criticalSuccess"
        : sum === 2
          ? "criticalFailure"
          : sum <= target
            ? "success"
            : "failure";
      return {
        die1,
        die2,
        sum,
        roll: sum,
        target,
        targetPercent,
        probability,
        result,
        label: resultLabels[result],
        tone: resultTones[result]
      };
    }

    function rollText(check) {
      const extremeLabel = check.result === "criticalSuccess" || check.result === "criticalFailure"
        ? ` · ${check.label}`
        : "";
      return `骰子结果：${diceResultText(check)}${extremeLabel}`;
    }

    function checkDisplayLabel(check) {
      return check.result === "criticalSuccess" || check.result === "criticalFailure"
        ? check.label

      levelUp();
    }

      const amount = amounts[check.result] || 0;
      state.meta.xp += amount;
      levelUp();
      if (state.raid && amount > 0) state.raid.log.unshift(`经验 +${amount}：${reason}。`);
      return amount;

    function upgradeStat(stat) {
      const gains = { maxHp: 3, attack: 2, armor: 2 };
      if (!state.meta.statPoints || !Object.hasOwn(gains, stat)) return;
      state.meta.levelSpend ||= { maxHp: 0, attack: 0, armor: 0 };
      if (state.meta.levelSpend[stat] >= 3) {
        openEvent("本级加点已达上限", "单项属性每次升级最多投入 3 点。\n可以把剩余属性点投入其他维度。", "warning");
        return;
      }
      if (state.meta.stats[stat] >= 100) {
        openEvent("属性已达上限", "该属性已经达到 100，无法继续投入属性点。", "warning");
        return;
      }
      state.meta.stats[stat] = Math.min(100, state.meta.stats[stat] + gains[stat]);
      state.meta.levelSpend[stat] += 1;
      state.meta.statPoints -= 1;
      render();
    }

    function normalizeStoredLoot(items) {
      if (!Array.isArray(items)) return items;
      return items.map((item) => {
        const catalogItem = data.lootPool.find((entry) => entry.id === item.id);
        return catalogItem ? { ...item, value: catalogItem.value } : item;
      });
    }

    function storedLootValue(items) {
      return (Array.isArray(items) ? items : []).reduce((total, item) => total + (Number(item.value) || 0), 0);
    }

        state.meta.stats = { ...levelBaseStats(state.meta.level), ...(saved.meta?.stats || {}) };
        Object.keys(state.meta.stats).forEach((stat) => {

        });
        state.selection = { teammate: "redwolf", weapon: "carbine", armor: "light", ...(saved.selection || {}) };
        if (!data.teammates.some((item) => item.id === state.selection.teammate)) state.selection.teammate = "redwolf";
        state.stash = normalizeStoredLoot(Array.isArray(saved.stash) ? saved.stash : state.stash);
        state.event = null;
        if (state.raid) {

          state.raid.maxHp ||= state.meta.stats.maxHp;

          state.raid.enemy &&= { ...state.raid.enemy, armor: state.raid.enemy.armor ?? 0, currentArmor: state.raid.enemy.currentArmor ?? state.raid.enemy.armor ?? 0, attack: state.raid.enemy.attack ?? state.raid.enemy.damage ?? 0 };
           state.raid.currentLocation ||= "dam-gate";
           state.raid.visitedLocations ||= [state.raid.currentLocation];
           state.raid.locationLoot = normalizeStoredLoot(state.raid.locationLoot || []);
           const oldInventoryValue = storedLootValue(state.raid.inventory);
           state.raid.inventory = normalizeStoredLoot(state.raid.inventory || []);
           const newInventoryValue = storedLootValue(state.raid.inventory);
           state.raid.lootValue = Math.max(0, (Number(state.raid.lootValue) || 0) - oldInventoryValue + newInventoryValue);
           state.raid.rollHistory ||= [];
           state.raid.alertedPatrols ||= [];
           state.raid.patrols = Array.isArray(state.raid.patrols) ? state.raid.patrols : [];
           state.raid.patrols = state.raid.patrols.map((patrol) => ({
             ...patrol,

             currentArmor: patrol.currentArmor ?? patrol.armor,
             alert: Boolean(patrol.alert),
             alertDistance: patrol.alertDistance ?? 2,
             lastMove: patrol.lastMove ?? null
           }));
           if (!state.raid.patrols.length && !state.raid.defeated) spawnPatrols();
           state.raid.hiddenEnemies = Array.isArray(state.raid.hiddenEnemies) ? state.raid.hiddenEnemies : [];

           const extractionLocationsValid = state.raid.extractions.length === 3
             && state.raid.extractions.every((point) => data.locations.some((location) => location.id === point.locationId && location.isExtraction));
           if ((!extractionLocationsValid) && !state.raid.defeated) spawnExtractionPoints();

           state.settlement.inventory = normalizeStoredLoot(state.settlement.inventory);

    function liveTaskDateKey(date = new Date()) {
      return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, "0"), String(date.getDate()).padStart(2, "0")].join("-");
    }

    function normalizeLiveTasks() {
      const today = liveTaskDateKey();
      const savedTasks = state.liveTasks?.date === today ? (state.liveTasks.tasks || {}) : {};
      state.liveTasks = { date: today, tasks: {} };
      LIVE_TASKS.forEach((task) => {
        const saved = savedTasks[task.id] || {};
        const savedUntil = Number(saved.activeUntil) || 0;
        const timedProgress = savedUntil
          ? task.target - Math.ceil(Math.max(0, savedUntil - Date.now()) / 1000)
          : 0;
        state.liveTasks.tasks[task.id] = {
          progress: clamp(Math.max(Number(saved.progress) || 0, timedProgress), 0, task.target),
          claimed: Boolean(saved.claimed),
          activeUntil: savedUntil > Date.now() ? savedUntil : null
        };
      });
    }

    function getLiveTask(id) {
      return LIVE_TASKS.find((task) => task.id === id);
    }

    function getLiveTaskState(id) {
      if (!state.liveTasks || state.liveTasks.date !== liveTaskDateKey() || !state.liveTasks.tasks?.[id]) {
        normalizeLiveTasks();
      }
      return state.liveTasks.tasks[id];
    }

    function liveTaskPercent(task, entry) {
      return Math.round(clamp(entry.progress / task.target * 100, 0, 100));
    }

    function liveTaskProgressText(task, entry) {
      if (task.target === 1) return entry.progress >= task.target ? "已完成" : "待确认";
      return `${entry.progress}/${task.target}${task.unit}`;
    }

    function updateLiveTaskVisual(task, entry) {
      const progress = document.querySelector(`[data-live-progress="${task.id}"]`);
      const label = document.querySelector(`[data-live-progress-label="${task.id}"]`);
      const action = document.querySelector(`[data-live-task-action="${task.id}"]`);
      if (progress) progress.style.width = `${liveTaskPercent(task, entry)}%`;
      if (label) label.textContent = liveTaskProgressText(task, entry);
      if (action && task.id === "watch-live") {
        action.textContent = entry.activeUntil ? `观看中 ${entry.progress}s` : entry.progress >= task.target ? "已完成" : task.actionLabel;
        action.disabled = Boolean(entry.activeUntil) || entry.progress >= task.target || entry.claimed;
      }
    }

    function stopLiveWatchTicker() {
      if (liveWatchTimer) {
        window.clearInterval(liveWatchTimer);
        liveWatchTimer = null;
      }
    }

    function syncLiveWatchTask() {
      const task = getLiveTask("watch-live");
      const entry = getLiveTaskState("watch-live");
      if (!entry.activeUntil) {
        stopLiveWatchTicker();
        return;
      }
      const secondsLeft = Math.max(0, Math.ceil((entry.activeUntil - Date.now()) / 1000));
      entry.progress = Math.max(entry.progress, task.target - secondsLeft);
      updateLiveTaskVisual(task, entry);
      saveGame();
      if (secondsLeft <= 0) {
        entry.progress = task.target;
        entry.activeUntil = null;
        stopLiveWatchTicker();
        updateLiveTaskVisual(task, entry);
        playSound("success", 0.4);
        openEvent("观看任务完成", "你已在虎牙直播间累计停留 1 分钟。\n现在可以回到任务面板领取哈夫币与经验奖励。", "success");
      }
    }

    function startLiveWatchTicker() {
      stopLiveWatchTicker();
      liveWatchTimer = window.setInterval(syncLiveWatchTask, 250);
    }

    function handleLiveTask(id) {
      const task = getLiveTask(id);
      const entry = getLiveTaskState(id);
      if (!task || entry.claimed || entry.progress >= task.target) return;
      if (id === "watch-live") {
        if (entry.activeUntil) return;
        entry.activeUntil = Date.now() + (task.target - entry.progress) * 1000;
        startLiveWatchTicker();
        playSound("open", 0.28);
        render();
        openEvent("观看计时已开始", "计时会在页面保持打开时继续进行。\n你可以先前往虎牙直播间，完成 1 分钟后返回领取奖励。", "info");

      playSound("success", 0.26);
      render();

    }

    function claimLiveTask(id) {
      const task = getLiveTask(id);
      const entry = getLiveTaskState(id);
      if (!task || entry.claimed) return;
      if (entry.progress < task.target) {
        openEvent("奖励暂未解锁", `完成“${task.title}”后才能领取本项奖励。`, "warning");

      }
      entry.claimed = true;
      entry.activeUntil = null;
      stopLiveWatchTicker();
      state.meta.credits += task.rewardCredits;
      awardXp(task.rewardXp, `直播任务：${task.title}`);

        `已领取 ${task.title}。\n获得 ${money(task.rewardCredits)} 和经验 ${task.rewardXp}。`,
        "success"

    function stashCount() {
      return state.stash.reduce((total, item) => total + (item.count || 0), 0);
    }

    function stashHasType(type, amount) {
      return state.stash
        .filter((item) => item.type === type)
        .reduce((total, item) => total + (item.count || 0), 0) >= amount;
    }

    function consumeStash(type, amount) {
      let remaining = amount;
      for (const item of state.stash.filter((entry) => entry.type === type)) {
        const consumed = Math.min(item.count || 0, remaining);
        item.count -= consumed;
        remaining -= consumed;
        if (remaining <= 0) break;
      }
      state.stash = state.stash.filter((item) => item.count > 0);
      return remaining === 0;
    }

    function addToStash(item) {
      const itemId = item.id || item.name;
      const existing = state.stash.find((entry) => (entry.id || entry.name) === itemId || entry.name === item.name);
      if (existing) {
        existing.id ||= itemId;
        existing.count += item.count || 1;
        return;
      }
      state.stash.push({
        id: itemId,
        name: item.name,
        type: item.type || "loot",
        count: item.count || 1,
        value: item.value || 0,
        rarity: item.rarity || "green",
        rarityName: item.rarityName || rarityLabels[item.rarity] || "物资"
      });
    }

    function stashCountById(id) {
      return state.stash
        .filter((item) => (item.id || item.name) === id)
        .reduce((total, item) => total + (item.count || 0), 0);
    }

    function consumeStashItem(id, amount = 1) {
      let remaining = amount;
      for (const item of state.stash.filter((entry) => (entry.id || entry.name) === id)) {
        const consumed = Math.min(item.count || 0, remaining);
        item.count -= consumed;
        remaining -= consumed;
        if (remaining <= 0) break;
      }
      state.stash = state.stash.filter((item) => item.count > 0);
      return remaining === 0;
    }

    function loadoutCost() {
      return 0;
    }

    function requiredMedical() {
      return selected("teammates").id === "beemedic" ? 3 : 2;
    }

    function canStartRaid() {
      return stashHasType("medical", requiredMedical());
    }

    function pickLoot(location) {
      const tierChances = location.riskLevel >= 3
        ? { red: 7, gold: 18, purple: 30, blue: 25, green: 15, white: 5 }
        : location.riskLevel === 2
          ? { red: 1, gold: 8, purple: 23, blue: 29, green: 26, white: 13 }
          : location.riskLevel === 1
            ? { red: 0, gold: 3, purple: 13, blue: 27, green: 37, white: 20 }
            : { red: 0, gold: 1, purple: 7, blue: 20, green: 42, white: 30 };
      const roll = Math.random() * 100;
      let cursor = 0;
      let rarity = "white";
      for (const [tier, percentage] of Object.entries(tierChances)) {
        cursor += percentage;
        if (roll < cursor) {
          rarity = tier;
          break;
        }
      }
      const candidates = data.lootPool.filter((item) => item.rarity === rarity);
      return pick(candidates.length ? candidates : data.lootPool);
    }

    function buySupplies() {
      if (state.meta.credits < SUPPLY_COST) return;
      state.meta.credits -= SUPPLY_COST;
      addToStash({ id: "medical-crate", name: "战地医疗包", type: "medical", count: 3, value: 220, rarity: "green", rarityName: "补给" });
      playSound("success");

    function buyShopItem(id) {
      const item = data.shop.find((entry) => entry.id === id);
      if (!item || state.meta.credits < item.price) return;
      state.meta.credits -= item.price;
      addToStash({
        id: item.id,
        name: item.name,
        type: item.stashType,
        count: item.bundle,
        value: item.value,
        rarity: item.rarity,
        rarityName: item.rarityName

      root.innerHTML = `

          if (eventTitle) eventTitle.textContent = state.event.title;
          if (eventStory) eventStory.classList.add("revealed");
          if (eventContinue) eventContinue.disabled = false;

        if (state.event?.action?.type === "settlement") {
          const reason = state.event.action.reason;
          state.event = null;
          completeFailRaid(reason);
          return;

                <div class="section-kicker">仓库预览</div>
                <ul class="loot-list">
                  ${state.stash.map((item) => `<li class="item-row"><div class="item-main"><div class="item-name">${lootNameMarkup(item)}</div><div class="item-meta">单价 ${money(item.value)}</div></div><span class="tag">×${item.count}</span></li>`).join("")}
                </ul>
              </div>
            </div>
          </aside>
        </div>
        ${renderLiveTasksMarkup()}
        <section class="panel" style="margin-top: 18px">
          <div class="panel-head">
            <div>
              <h2>军需商店</h2>
              <div class="item-meta">把哈夫币换成下一局的战术选择，所有商品会进入仓库。</div>
            </div>
            <span class="tag gold">哈夫币 ${money(state.meta.credits)}</span>
          </div>
          <div class="panel-body">
            <div class="shop-grid">
              ${data.shop.map((item) => `
                <article class="shop-card">
                  <div class="shop-card-head">
                    <div class="shop-card-name">${item.name}</div>
                    <span class="tag ${item.rarity}">${item.category}</span>
                  </div>
                  <div class="shop-card-desc">${item.desc}</div>
                  <div class="shop-card-effect">${item.effect}</div>
                  <div class="item-meta">仓库已有 ×${stashCountById(item.id)}</div>
                  <div class="shop-card-footer">
                    <span class="shop-price">${money(item.price)}</span>
                    <button class="button secondary" data-buy-shop="${item.id}" ${state.meta.credits < item.price ? "disabled" : ""}>采购 ×${item.bundle}</button>
                  </div>
                </article>
              `).join("")}
            </div>
          </div>
        </section>
      `;
      document.querySelectorAll("[data-select]").forEach((button) => button.addEventListener("click", () => {
        state.selection[button.dataset.select] = button.dataset.id;
        render();
      }));
      document.querySelectorAll("[data-upgrade]").forEach((button) => button.addEventListener("click", () => upgradeStat(button.dataset.upgrade)));
      document.querySelectorAll("[data-buy-shop]").forEach((button) => button.addEventListener("click", () => buyShopItem(button.dataset.buyShop)));
      document.querySelectorAll("[data-live-task-action]").forEach((button) => button.addEventListener("click", () => handleLiveTask(button.dataset.liveTaskAction)));
      document.querySelectorAll("[data-live-task-claim]").forEach((button) => button.addEventListener("click", () => claimLiveTask(button.dataset.liveTaskClaim)));
      $("#startRaid").addEventListener("click", startRaid);
    }

    function startRaid() {
      const teammate = selected("teammates");
      const entryCost = loadoutCost();
      if (!canStartRaid()) return;
      playSound("open", 0.36);
      consumeStash("medical", requiredMedical());
      const stats = state.meta.stats;
      state.raid = {
        hp: stats.maxHp,
        maxHp: stats.maxHp,
        armor: stats.armor,
        maxArmor: stats.armor,
        attack: stats.attack,
        energy: 100,
        medkits: teammate.id === "beemedic" ? 2 : 1,
        bandages: 1,
        teammate,
        entryCost,
        currentLocation: "dam-gate",
        visitedLocations: ["dam-gate"],
        locationLoot: [],
        locationSearched: false,
        inventory: [],
        inventoryLimit: 6,
        lootValue: 0,
        kills: 0,
        attackBonus: 0,
        damageShield: 0,
        safeMoveCharges: 0,
        searchBonus: 0,
        extractBonus: 0,
        searched: [],
        enemy: null,
        patrols: [],
        alertedPatrols: [],
        extractions: [],
        bossDefeated: false,
        hiddenEnemies: [],
        hiddenEnemiesInitialized: false,
        log: ["行动开始。你从外围区域进入，先观察，再决定是否深入。"],
        rollHistory: []
      };
      spawnExtractionPoints();
      spawnPatrols();
      spawnHiddenEnemies();
      spawnLocation(data.locations[0], true);
      state.event = {
        title: "开始对局",
        message: `你已进入零号大坝，从${data.locations[0].name}开始行动。\n点击区域移动，进入区域后再搜索物资。`,
        tone: "info"
      };
      setScreen();
      render();
    }

    function encounterFor(location) {
      let probability = 20 + location.riskLevel * 14;
      if (state.raid.teammate.id === "hackclaw") probability -= 12;
      if (state.raid.teammate.id === "redwolf") probability += 6;
      if (!chance(probability)) return null;
      let enemy = data.enemies[0];
      if (location.riskLevel >= 1) {
        enemy = pick(data.enemies.filter((item) => ["rocket", "shield", "flamethrower"].includes(item.id)));
      }
      return { ...enemy, currentHp: enemy.hp, currentArmor: enemy.armor, combatTurns: 0 };
    }

    function spawnExtractionPoints() {
      const raid = state.raid;
      if (!raid) return;
      const candidates = data.locations
        .filter((location) => location.isExtraction)
        .sort(() => Math.random() - 0.5);
      raid.extractions = EXTRACTION_TEMPLATES.map((template, index) => ({
        ...template,
        locationId: candidates[index]?.id || data.locations.find((location) => location.isExtraction)?.id
      }));
    }

    function extractionAtLocation(locationId) {
      return (state.raid?.extractions || []).find((point) => point.locationId === locationId) || null;
    }

    function spawnPatrols() {
      const raid = state.raid;
      if (!raid) return;
      const patrolLocations = [
        "cement-factory",
        "quarry-yard",
        "barracks",
        "warehouse",
        "small-barracks",
        "administration",
        "power-station",
        "relay-room",
        "visitor-center"
      ].filter((id) => id !== raid.currentLocation);
      const bossLocations = ["administration", "power-station"].filter((id) => id !== raid.currentLocation);
      const positions = [];
      const takeLocation = (pool) => {
        const available = pool.filter((id) => !positions.includes(id));
        const locationId = pick(available.length ? available : pool);
        positions.push(locationId);
        return locationId;
      };
      const createContact = (enemy, index, locationId, source = "patrol") => ({
        id: `${source}-${Date.now()}-${index}`,
        enemyId: enemy.id,
        name: enemy.name,
        role: enemy.role,
        tactic: enemy.tactic,
        currentLocation: locationId,
        currentHp: enemy.hp,
        currentArmor: enemy.armor,
        hp: enemy.hp,
        armor: enemy.armor,
        attack: enemy.attack,
        reward: enemy.reward,
        evasion: enemy.evasion,
        dropTier: enemy.dropTier,
        dropChance: enemy.dropChance,
        dropCount: enemy.dropCount,
        attributePoints: enemy.attributePoints,
        boss: Boolean(enemy.boss),
        asset: enemy.asset,
        source,
        hidden: source === "hidden",
        alert: false,
        alertDistance: 2,
        lastMove: null
      });
      raid.patrols = [
        createContact(data.enemies.find((item) => item.id === "rocket"), 1, takeLocation(patrolLocations)),
        createContact(data.enemies.find((item) => item.id === "shield"), 2, takeLocation(patrolLocations)),
        createContact(data.enemies.find((item) => item.id === "machinegunner"), 3, takeLocation(patrolLocations)),
        createContact(data.enemies.find((item) => item.id === "saeed"), 4, takeLocation(bossLocations.length ? bossLocations : patrolLocations))
      ];
      raid.alertedPatrols = [];
    }

    function spawnHiddenEnemies() {
      const raid = state.raid;
      if (!raid) return;
      const occupiedByPatrol = new Set((raid.patrols || []).map((patrol) => patrol.currentLocation));
      const hiddenLocations = data.locations
        .filter((location) => !location.isExtraction && location.id !== raid.currentLocation && !occupiedByPatrol.has(location.id))
        .sort(() => Math.random() - 0.5)
        .slice(0, 3);
      const hiddenTypes = ["rocket", "shield", "machinegunner"];
      raid.hiddenEnemies = hiddenTypes.map((enemyId, index) => {
        const enemy = data.enemies.find((item) => item.id === enemyId);
        const location = hiddenLocations[index] || data.locations.find((item) => !item.isExtraction && item.id !== "dam-gate" && !occupiedByPatrol.has(item.id));
        return {
          ...enemy,
          id: `hidden-${Date.now()}-${index}`,
          enemyId,
          source: "hidden",
          hidden: true,
          hiddenLocation: location.id,
          currentLocation: location.id,
          currentHp: enemy.hp,
          currentArmor: enemy.armor,
          combatTurns: 0
        };
      });
      raid.hiddenEnemiesInitialized = true;
    }

    function locationDistance(fromId, toId) {
      if (fromId === toId) return 0;
      const queue = [[fromId, 0]];
      const visited = new Set([fromId]);
      while (queue.length) {
        const [id, distance] = queue.shift();
        const location = data.locations.find((item) => item.id === id);
        for (const nextId of location?.neighbors || []) {
          if (nextId === toId) return distance + 1;
          if (!visited.has(nextId)) {
            visited.add(nextId);
            queue.push([nextId, distance + 1]);
          }
        }
      }
      return Number.POSITIVE_INFINITY;
    }

    function patrolAtLocation(locationId) {
      return (state.raid?.patrols || []).filter((patrol) => patrol.currentLocation === locationId);
    }

    function patrolStep(patrol, chasing, avoidLocation = null, occupied = new Set()) {
      const location = data.locations.find((item) => item.id === patrol.currentLocation);
      const candidates = (location?.neighbors || []).filter((id) => id !== avoidLocation && !occupied.has(id));
      if (!candidates.length) return patrol.currentLocation;
      if (!chasing) return pick(candidates);
      const distances = candidates.map((id) => ({ id, distance: locationDistance(id, state.raid.currentLocation) }));
      const shortest = Math.min(...distances.map((item) => item.distance));
      return pick(distances.filter((item) => item.distance === shortest).map((item) => item.id));
    }

    function engagePatrol(patrol) {
      const raid = state.raid;
      if (!raid || !patrol) return null;
      raid.patrols = (raid.patrols || []).filter((item) => item.id !== patrol.id);
      raid.alertedPatrols = (raid.alertedPatrols || []).filter((id) => id !== patrol.id);
      return {
        ...patrol,
        patrolId: patrol.id,
        currentHp: patrol.currentHp ?? patrol.hp,
        currentArmor: patrol.currentArmor ?? patrol.armor,
        combatTurns: 0
      };
    }

    function engageHiddenEnemy(hidden) {
      const raid = state.raid;
      if (!raid || !hidden) return null;
      raid.hiddenEnemies = (raid.hiddenEnemies || []).filter((item) => item.id !== hidden.id);
      return {
        ...hidden,
        hiddenId: hidden.id,
        currentHp: hidden.currentHp ?? hidden.hp,
        currentArmor: hidden.currentArmor ?? hidden.armor,
        combatTurns: 0
      };
    }

    function revealHiddenEnemy(locationId, check = null) {
      const raid = state.raid;
      const location = data.locations.find((item) => item.id === locationId);
      if (!raid || !location || location.isExtraction || raid.enemy) return null;
      const candidates = (raid.hiddenEnemies || []).filter((hidden) => hidden.hiddenLocation === locationId);
      if (!candidates.length) return null;
      const teammateModifier = raid.teammate.id === "hackclaw" ? -14 : raid.teammate.id === "redwolf" ? 8 : 0;
      const triggerChance = clamp(30 + location.riskLevel * 14 + teammateModifier, 18, 62);
      if (check?.result !== "criticalFailure" && !chance(triggerChance)) return null;
      const hidden = pick(candidates);
      return engageHiddenEnemy(hidden);
    }

    function movePatrols(safeMove = false) {
      const raid = state.raid;
      if (!raid || !Array.isArray(raid.patrols)) return { notices: [], engaged: null };
      const notices = [];
      let engaged = null;
      const occupied = new Set(raid.patrols.map((patrol) => patrol.currentLocation));
      for (const patrol of [...raid.patrols]) {
        const distanceBefore = locationDistance(patrol.currentLocation, raid.currentLocation);
        if (distanceBefore === 0 && !safeMove) {
          if (!engaged) {
            engaged = engagePatrol(patrol);
            notices.push(`${patrol.name}已经进入${data.locations.find((item) => item.id === raid.currentLocation)?.name || "当前区域"}，遭遇战爆发。`);
          } else {
            const oldLocation = patrol.currentLocation;
            occupied.delete(oldLocation);
            patrol.currentLocation = patrolStep(patrol, false, raid.currentLocation, occupied);
            patrol.lastMove = oldLocation;
            occupied.add(patrol.currentLocation);
          }
          continue;
        }
        if (distanceBefore >= 1 && distanceBefore <= (patrol.alertDistance || 2)) {
          patrol.alert = true;
          if (!raid.alertedPatrols.includes(patrol.id)) {
            raid.alertedPatrols.push(patrol.id);
            notices.push(`${patrol.name}在${distanceBefore}格外发现动静，进入警戒状态。`);
          }
        }
        const oldLocation = patrol.currentLocation;
        occupied.delete(oldLocation);
        const nextLocation = patrolStep(
          patrol,
          patrol.alert,
          safeMove ? raid.currentLocation : null,
          occupied
        );
        if (!patrol.alert && nextLocation === raid.currentLocation) {
          patrol.currentLocation = oldLocation;
        } else {
          patrol.currentLocation = nextLocation;
        }
        patrol.lastMove = oldLocation;
        occupied.add(patrol.currentLocation);
        const distanceAfter = locationDistance(patrol.currentLocation, raid.currentLocation);
        if (patrol.alert && distanceAfter > 0 && distanceAfter <= (patrol.alertDistance || 2)) {
          notices.push(`${patrol.name}向${data.locations.find((item) => item.id === raid.currentLocation)?.name || "你的位置"}靠近，当前距离 ${distanceAfter} 格。`);
        }
        if (distanceAfter === 0 && !safeMove) {
          if (!engaged) {
            engaged = engagePatrol(patrol);
            notices.push(`${patrol.name}追入当前区域，遭遇战爆发。`);
          } else {
            const oldLocation = patrol.currentLocation;
            occupied.delete(oldLocation);
            patrol.currentLocation = patrolStep(patrol, false, raid.currentLocation, occupied);
            patrol.lastMove = oldLocation;
            occupied.add(patrol.currentLocation);
          }
        }
      }
      return { notices, engaged };
    }

    function spawnLocation(location, initial = false) {
      const raid = state.raid;
      if (!raid) return;
      raid.currentLocation = location.id;
      raid.locationSearched = false;
      raid.locationLoot = [];
      const safeMove = !initial && (raid.safeMoveCharges || 0) > 0;
      if (safeMove) raid.safeMoveCharges -= 1;
      const currentEnemy = raid.enemy;
      const patrol = patrolAtLocation(location.id)[0];
      raid.enemy = currentEnemy || patrol && engagePatrol(patrol) || (location.isExtraction || initial || safeMove ? null : encounterFor(location));
      if (location.isExtraction) return;
      const lootChance = 65 + location.riskLevel * 8 + (raid.teammate.id === "hackclaw" ? 10 : 0);
      if (initial || chance(lootChance)) {
        const lootCount = location.riskLevel >= 2 && chance(40) ? 2 : 1;
        for (let index = 0; index < lootCount; index += 1) {
          raid.locationLoot.push({ ...pickLoot(location) });
        }
      }
    }

    function travelToLocation(id) {
      const raid = state.raid;
      const location = data.locations.find((item) => item.id === id);
      const currentLocation = data.locations.find((item) => item.id === raid?.currentLocation);
      if (!raid || raid.defeated || !location || raid.enemy || raid.currentLocation === id) return;
      if (currentLocation && !currentLocation.neighbors.includes(id)) {
        playSound("failure");
        openEvent("路线不可达", `从${currentLocation.name}不能直接前往${location.name}。\n请先沿地图上的相邻路线移动。`, "warning");
        return;
      }
      const target = clamp(62 - location.riskLevel * 8 + (raid.teammate.id === "hackclaw" ? 8 : 0), 35, 82);
      const check = rollCheck(target);
      raid.rollHistory.unshift({ type: "move", location: location.name, ...check });
      if (check.result === "criticalFailure") {
        playSound("failure");
        const xp = grantCheckXp(check, { criticalFailure: 3, failure: 0, success: 0, criticalSuccess: 0 }, "行进大失败");
        addLog(`行进判定大失败：你在前往${location.name}时迷失路线。`);
        openEvent("行进大失败", `你没有抵达${location.name}。\n路线判断失误，本次移动未完成。${xp ? `\n获得经验 ${xp}。` : ""}`, check.tone, check);
        return;
      }
      const safeMove = (raid.safeMoveCharges || 0) > 0;
      const destinationPatrol = !safeMove ? patrolAtLocation(location.id)[0] : null;
      raid.currentLocation = location.id;
      const patrolMovement = { notices: [], engaged: null };
      if (destinationPatrol) {
        raid.enemy = engagePatrol(destinationPatrol);
        patrolMovement.engaged = raid.enemy;
        patrolMovement.notices.unshift(`${destinationPatrol.name}驻守在${location.name}，你主动进入了它的巡逻区域，遭遇战爆发。`);
      }
      const patrolFollowUp = movePatrols(safeMove);
      patrolMovement.notices.push(...patrolFollowUp.notices);
      patrolMovement.engaged ||= patrolFollowUp.engaged;
      spawnLocation(location);
      playSound(raid.enemy ? "failure" : "move", raid.enemy ? 0.34 : 0.26);
      if (!Array.isArray(raid.visitedLocations)) raid.visitedLocations = [raid.currentLocation];
      if (!raid.visitedLocations.includes(id)) raid.visitedLocations.push(id);
      const xp = grantCheckXp(check, { criticalFailure: 3, failure: 8, success: 14, criticalSuccess: 22 }, "完成区域移动");
      addLog(`你移动到${location.name}。区域正在刷新敌人与物资。`);
      if (location.isExtraction) addLog(`${location.name}是独立撤离场景，不刷新物资。`);
      patrolMovement.notices.forEach((notice) => {
        raid.log.unshift(notice);
      });
      if (patrolMovement.notices.length) render();
      if (raid.enemy) addLog(`发现${raid.enemy.name}活动，必须先处理接触。`);
      if (raid.locationLoot.length) addLog(`侦察到 ${raid.locationLoot.length} 个可搜索物资点。`);
      const patrolFeedback = patrolMovement.notices.length ? `\n${patrolMovement.notices.join("\n")}` : "";
      openEvent(
        check.result === "criticalSuccess"
          ? `行进大成功 · ${location.name}`
          : check.result === "criticalFailure"
            ? "行进大失败"
            : raid.enemy
              ? `遭遇${raid.enemy.name}`
              : `抵达${location.name}`,
        raid.enemy
          ? `${rollText(check)}${patrolFeedback}\n你在${location.name}发现了${raid.enemy.name}。\n先处理敌人，才能继续搜索或移动。${xp ? `\n获得经验 ${xp}。` : ""}`
            : location.isExtraction
            ? `${rollText(check)}${patrolFeedback}\n你已抵达独立撤离场景${location.name}。请查看地图节点标记并启动本局分配的撤离规则。${xp ? `\n获得经验 ${xp}。` : ""}`
            : raid.locationLoot.length
            ? `${rollText(check)}\n区域已刷新，发现 ${raid.locationLoot.length} 个可搜索物资点。${patrolFeedback}${xp ? `\n获得经验 ${xp}。` : ""}`
            : `${rollText(check)}\n区域本次没有刷新可带走物资。${patrolFeedback}${xp ? `\n获得经验 ${xp}。` : ""}`,
        raid.enemy ? "combat" : check.tone,
        check
      );
    }

    function searchCurrentLocation() {
      const raid = state.raid;
      if (!raid || raid.defeated || raid.enemy || raid.locationSearched) return;
      const location = data.locations.find((item) => item.id === raid.currentLocation) || data.locations[0];
      if (location.isExtraction) {
        playSound("failure");
        openEvent("撤离场景", "这里是独立撤离点，不刷新物资，也不提供搜索。请根据地图上的撤离规则进行操作。", "info");
        return;
      }
      playSound("search", 0.24);
      const target = clamp(78 - location.riskLevel * 6 + (raid.teammate.id === "hackclaw" ? 10 : 0) + (raid.searchBonus || 0), 58, 94);
      const check = rollCheck(target);
      raid.rollHistory.unshift({ type: "search", location: location.name, ...check });
      raid.locationSearched = true;
      raid.searchBonus = 0;
      const xp = grantCheckXp(check, { criticalFailure: 3, failure: 8, success: 18, criticalSuccess: 32 }, "完成区域搜索");
      const hiddenEnemy = revealHiddenEnemy(location.id, check);

      if (check.result === "criticalFailure") {
        playSound("failure", 0.38);
        const enemy = hiddenEnemy || encounterFor(location);
        if (enemy) raid.enemy = enemy;
        raid.locationLoot = [];
        addLog(`搜索判定大失败：你在${location.name}制造了动静。`);
        openEvent(
          enemy ? `搜索大失败 · 遭遇${enemy.name}` : "搜索大失败",
          `${rollText(check)}\n你触发了危险动静。${enemy ? `\n${enemy.name}被吸引过来，必须先战斗。` : ""}\n获得经验 ${xp}。`,
          "combat",
          check
        );
        return;
      }

      if (check.result === "failure") {
        const fallbackCandidates = data.lootPool.filter((item) => ["white", "green", "blue"].includes(item.rarity));
        const fallbackLoot = pick(fallbackCandidates.length ? fallbackCandidates : data.lootPool);
        raid.locationLoot = raid.inventory.length < raid.inventoryLimit ? [{ ...fallbackLoot }] : [];
        if (raid.locationLoot.length) {
          playSound(hiddenEnemy ? "failure" : "success", hiddenEnemy ? 0.34 : 0.26);
          raid.inventory.push(raid.locationLoot[0]);
          raid.lootValue += raid.locationLoot[0].value;
          const foundItem = raid.locationLoot[0];
          raid.locationLoot = [];
          addLog(`你搜索了${location.name}，带出基础物资：${lootNameMarkup(foundItem)}，价值 ${money(foundItem.value)}。`);
          if (hiddenEnemy) {
            raid.enemy = hiddenEnemy;
            addLog(`${hiddenEnemy.name}从${location.name}的掩体中现身，战斗被迫开始。`);
          }
          openEvent(
            hiddenEnemy ? `搜索触发遭遇 · ${hiddenEnemy.name}` : "搜索完成",
            "",
            hiddenEnemy ? "combat" : "info",
            check,
            `<p>${rollText(check)}</p>${lootResultsMarkup([foundItem])}<p>没有找到高价值目标，但带出了一件基础物资。获得经验 <strong>${xp}</strong>。</p>${hiddenEnemy ? `<p><strong>${hiddenEnemy.name}从场景中现身，先处理敌人才能继续行动。</strong></p>` : ""}`
          );
        } else {
          playSound(hiddenEnemy ? "failure" : "failure", 0.3);
          addLog(`你搜索了${location.name}，发现物资但背包已满。`);
          if (hiddenEnemy) {
            raid.enemy = hiddenEnemy;
            addLog(`${hiddenEnemy.name}从${location.name}的掩体中现身，战斗被迫开始。`);
          }
          openEvent(
            hiddenEnemy ? `搜索触发遭遇 · ${hiddenEnemy.name}` : "背包已满",
            `${rollText(check)}\n发现了基础物资，但当前背包没有空位。${hiddenEnemy ? `\n${hiddenEnemy.name}从场景中现身，先处理敌人才能继续行动。` : ""}`,
            hiddenEnemy ? "combat" : "warning",
            check
          );
        }
        return;
      }

      if (!raid.locationLoot.length) {
        raid.locationLoot.push({ ...pickLoot(location) });
      }

      const found = [];
      const searchLoot = [...raid.locationLoot];
      if (check.result === "criticalSuccess") searchLoot.push({ ...pickLoot(location) });
      searchLoot.forEach((item) => {
        if (raid.inventory.length >= raid.inventoryLimit) return;
        raid.inventory.push(item);
        raid.lootValue += item.value;
        found.push(item);
      });
      raid.locationLoot = [];
      addLog(found.length
        ? `你搜索了当前区域，获得：${found.map((item) => `${lootNameMarkup(item)}（${money(item.value)}）`).join("、")}。`
        : "背包已满，物资暂时无法带走。");
      if (hiddenEnemy) {
        playSound("failure", 0.34);
        raid.enemy = hiddenEnemy;
        addLog(`${hiddenEnemy.name}从${location.name}的掩体中现身，战斗被迫开始。`);
      }
      if (found.length && !hiddenEnemy) playSound("success", 0.28);
      openEvent(
        hiddenEnemy ? `搜索触发遭遇 · ${hiddenEnemy.name}` : check.result === "criticalSuccess" ? "搜索大成功" : found.length ? "搜索完成" : "背包已满",
        found.length
          ? hiddenEnemy ? `${rollText(check)}\n你带出物资时，${hiddenEnemy.name}从场景中现身，先处理敌人才能继续行动。` : ""
          : `${rollText(check)}\n发现了物资，但当前背包没有空位。${hiddenEnemy ? `\n${hiddenEnemy.name}从场景中现身，先处理敌人才能继续行动。` : ""}`,
        hiddenEnemy ? "combat" : check.result === "criticalSuccess" ? "success" : found.length ? "info" : "warning",
        check,
        found.length
          ? `<p>${rollText(check)}</p>${lootResultsMarkup(found)}${check.result === "criticalSuccess" ? "<p>大成功额外发现了一份物资。</p>" : ""}<p>获得经验 <strong>${xp}</strong>。</p>${hiddenEnemy ? `<p><strong>${hiddenEnemy.name}从场景中现身，先处理敌人才能继续行动。</strong></p>` : ""}`
          : null
      );
    }

    function searchLocation(id) {
      const location = data.locations.find((item) => item.id === id);
      const raid = state.raid;
      if (!raid || raid.defeated || raid.enemy || raid.searched.includes(id) || location?.isExtraction) return;
      raid.searched.push(id);
      const lootCount = location.riskLevel >= 2 && chance(48) ? 2 : 1;
      for (let index = 0; index < lootCount; index += 1) {
        if (raid.inventory.length >= raid.inventoryLimit) break;
        const loot = { ...pickLoot(location) };
        raid.inventory.push(loot);
        raid.lootValue += loot.value;
      }
      const foundItems = raid.inventory.slice(-lootCount);
      const foundText = raid.inventory.length ? foundItems.map((item) => `${lootNameMarkup(item)}（${money(item.value)}）`).join("、") : "没有空间";
      addLog(`你搜索了${location.name}，获得：${foundText}。`);
      const enemy = encounterFor(location);
      if (enemy) {
        raid.enemy = enemy;
        addLog(`遭遇${enemy.name}，战斗被迫开始。`);
      }
    }

    function scanArea() {
      const raid = state.raid;
      if (!raid || raid.defeated || raid.enemy) return;
      if (raid.teammate.id === "hackclaw") {
        playSound("success", 0.26);
        addLog("侦察手标记了安全路线。");
        openEvent("扫描完成", "骇爪发现了一条更安全的移动路线。", "success");
      } else if (chance(65)) {
        playSound("success", 0.26);
        addLog("你发现了一条绕开巡逻的路线。");
        openEvent("扫描完成", "你发现了一条绕开巡逻的路线。", "success");
      } else {
        playSound("failure", 0.22);
        addLog("扫描没有发现有用信息，但没有推进风险。");
        openEvent("扫描结果", "没有发现有用信息。\n你仍然可以继续搜索、移动或处理当前区域。", "warning");
      }
    }

    function attackTargetFor(raid, enemy) {
      const attack = raid.attack + (raid.attackBonus || 0);
      return clamp(58 + statBonus(attack) - enemy.evasion + (raid.teammate.id === "redwolf" ? 8 : 0), 30, 88);
    }

    function defenseTargetFor(raid) {
      return clamp(48 + statBonus(raid.armor) * 2, 30, 86);
    }

    function healthStatus(raid) {
      const ratio = raid.maxHp ? raid.hp / raid.maxHp : 0;
      if (ratio <= .2) {
        return { level: "critical", title: "生命危急", message: `当前生命 ${raid.hp}/${raid.maxHp}，建议立即使用医疗物资。` };
      }
      if (ratio <= .4) {
        return { level: "low", title: "生命偏低", message: `当前生命 ${raid.hp}/${raid.maxHp}，下一轮交火前建议先治疗。` };
      }
      return null;
    }

    function attackNarrative(check, enemyName, weapon, damage) {
      if (check.result === "criticalSuccess") {
        return `你等到${enemyName}暴露破绽，${weapon}精准撕开护甲，${damage} 点伤害让对方阵线明显动摇。`;
      }
      if (check.result === "success") {
        return `你稳住准星压低枪口，${weapon}连续命中${enemyName}，成功打出 ${damage} 点伤害。`;
      }
      if (check.result === "criticalFailure") {
        return `枪口意外上跳，子弹擦着${enemyName}身侧飞过，你的火力节奏被迫中断。`;
      }
      return `你扣下扳机，但${enemyName}及时缩回掩体，弹着点只在墙面上溅起一串火花。`;
    }

    function defenseNarrative(check, enemyName, damage) {
      if (check.result === "criticalSuccess") {
        return `你借着掩体完成极限闪避，${enemyName}的反击全部落空。`;
      }
      if (check.result === "success") {
        return `你压低身位让护甲吃下冲击，${enemyName}的反击只造成 ${damage} 点伤害。`;
      }
      if (check.result === "criticalFailure") {
        return `敌人抓住你换弹的空档，火力正面压过来，你受到 ${damage} 点重击。`;
      }
      return `${enemyName}抓住短暂空档发动反击，弹片擦过护甲，你受到 ${damage} 点伤害。`;
    }

    function useRaidItem(id) {
      const raid = state.raid;
      const item = data.shop.find((entry) => entry.id === id);
      if (!raid || raid.defeated || !item || item.stashType !== "utility" || !stashCountById(id)) return;
      if (id === "smoke-grenade" && !raid.enemy) return;
      if (id === "stim-shot" && raid.hp >= raid.maxHp) return;
      if (!consumeStashItem(id)) return;

      if (id === "combat-stim") {
        playSound("success", 0.28);
        raid.attackBonus = (raid.attackBonus || 0) + 8;
        addLog("你注射战斗兴奋剂，本局攻击判定线与伤害提高。");
        openEvent("战斗兴奋剂生效", "本局攻击力临时提高 8 点，适合处理高护甲目标。", "success");
        return;
      }
      if (id === "piercing-magazine") {
        playSound("success", 0.28);
        raid.attackBonus = (raid.attackBonus || 0) + 5;
        addLog("你装入穿甲弹匣，本局火力校准完成。");
        openEvent("穿甲弹匣装填", "本局攻击力临时提高 5 点，下一轮交火更容易撕开护甲。", "success");
        return;
      }
      if (id === "armor-seal") {
        playSound("success", 0.28);
        raid.damageShield = (raid.damageShield || 0) + 20;
        addLog("你部署装甲止损板，下一次交火可吸收 20 点伤害。");
        openEvent("装甲止损板部署", "下一次敌方反击造成的伤害将优先由止损板吸收，最多吸收 20 点。", "success");
        return;
      }
      if (id === "stim-shot") {
        playSound("health", 0.3);
        const amount = Math.min(24, raid.maxHp - raid.hp);
        raid.hp += amount;
        addLog(`你使用快速恢复针，恢复 ${amount} 点生命。`);
        openEvent("快速恢复针生效", `立即恢复 ${amount} 点生命，当前生命 ${raid.hp}/${raid.maxHp}。`, "success");
        return;
      }
      if (id === "smoke-grenade") {
        playSound("open", 0.28);
        const enemyName = raid.enemy.name;
        raid.enemy = null;
        addLog(`你投掷战术烟雾弹，成功脱离${enemyName}。`);
        openEvent("烟幕脱离", `烟雾遮断了${enemyName}的视线，你已脱离当前战斗，可以继续移动或搜索。`, "success");
        return;
      }
      if (id === "recon-drone") {
        playSound("success", 0.28);
        raid.safeMoveCharges = (raid.safeMoveCharges || 0) + 1;
        raid.searchBonus = (raid.searchBonus || 0) + 12;
        addLog("侦察无人机升空，下一次移动将避开遭遇，搜索判定线提高。");
        openEvent("侦察无人机部署", "下一次移动不会触发敌人遭遇，并为下一次搜索判定线提高 12 点。", "success");
        return;
      }
      if (id === "extraction-beacon") {
        playSound("success", 0.28);
        raid.extractBonus = (raid.extractBonus || 0) + 10;
        addLog("撤离信标开始工作，撤离判定线提高 10 点。");
        openEvent("撤离信标启动", "本局撤离判定线提高 10 点，选择合适的撤离点完成行动。", "success");
      }
    }

    function raidUtilityButton(item, raid) {
      const count = stashCountById(item.id);
      const disabled = count <= 0 || (item.id === "smoke-grenade" && !raid.enemy) || (item.id === "stim-shot" && raid.hp >= raid.maxHp);
      return `<button class="button secondary" data-use-item="${item.id}" ${disabled ? "disabled" : ""}>${item.name} ×${count}</button>`;
    }

    function grantEnemyDrops(enemy) {
      if (!enemy?.dropTier || !chance(enemy.dropChance || 0)) {
        return { items: [], attributePoints: 0 };
      }
      const dropPool = data.shop.filter((item) => item.stashType === "medical" || item.stashType === "utility");
      const dropCount = enemy.dropCount || (enemy.dropTier === "high" && chance(28) ? 2 : 1);
      const items = [];
      for (let index = 0; index < dropCount; index += 1) {
        const item = pick(dropPool);
        addToStash({
          id: item.id,
          name: item.name,
          type: item.stashType,
          count: 1,
          value: item.value,
          rarity: item.rarity,
          rarityName: item.rarityName
        });
        items.push(item.name);
      }
      const attributePoints = enemy.attributePoints || 0;
      if (attributePoints) state.meta.statPoints += attributePoints;
      return { items, attributePoints };
    }

    function enemyDropText(drop) {
      const parts = [];
      if (drop.items.length) parts.push(`获得道具：${drop.items.join("、")}`);
      if (drop.attributePoints) parts.push(`额外获得属性点 ×${drop.attributePoints}`);
      return parts.join("；");
    }

    function attack() {
      const raid = state.raid;
      if (!raid || raid.defeated || !raid.enemy) return;
      playSound("attack", 0.28);
      const enemyName = raid.enemy.name;
      const target = attackTargetFor(raid, raid.enemy);
      const check = rollCheck(target);
      raid.rollHistory.unshift({ type: "attack", enemy: enemyName, ...check });
      const effectiveAttack = raid.attack + (raid.attackBonus || 0);
      const baseDamage = armorReducedDamage(effectiveAttack, raid.enemy.currentArmor ?? raid.enemy.armor ?? 0);
      const damage = check.result === "criticalSuccess"
        ? Math.max(1, Math.round(baseDamage * 1.5))
        : check.result === "success"
          ? baseDamage
          : 0;
      if (damage > 0) raid.enemy.currentHp -= damage;
      const xp = grantCheckXp(check, { criticalFailure: 4, failure: 8, success: 18, criticalSuccess: 30 }, "完成战斗判定");
      const attackStory = attackNarrative(check, enemyName, gearPackage("attack", effectiveAttack).detail, damage);
      addLog(`${attackStory} ${rollText(check)}`);
      if (raid.enemy.currentHp <= 0) {
        playSound("success", 0.38);
        const defeatedEnemy = raid.enemy;
        raid.kills += 1;
        if (defeatedEnemy.boss) {
          raid.bossDefeated = true;
          addLog("赛义德已被击败，首领专属撤离点开放。");
        }
        const reward = defeatedEnemy.reward;
        const drop = grantEnemyDrops(defeatedEnemy);
        const dropText = enemyDropText(drop);
        raid.lootValue += reward;
        addLog(`${defeatedEnemy.name}已被击退，战利品价值增加 ${money(reward)}。`);
        if (dropText) addLog(`${defeatedEnemy.name}掉落：${dropText}。`);
        raid.enemy = null;
        if (raid.teammate.id === "redwolf") {
          raid.hp = Math.min(raid.maxHp, raid.hp + 8);
          addLog("红狼完成击退，恢复 8 点生命。");
        }
        openEvent(
          check.result === "criticalSuccess" ? "战斗大成功" : "目标已击退",
          `${attackStory}\n${rollText(check)}\n你击退了${enemyName}。\n战利品估值增加 ${money(reward)}，获得经验 ${xp}。${dropText ? `\n${dropText}。` : ""}`,
          "success",
          check,
          `<p>${attackStory}</p><p><strong>攻击判定：${checkRuleText(check)}</strong>，本次掷出 <strong>${diceResultText(check)}</strong>。</p><p>目标已击退，战利品估值增加 <strong>${money(reward)}</strong>，获得经验 <strong>${xp}</strong>。</p>${dropText ? `<p><strong>${dropText}。</strong></p>` : ""}`
        );
        return;
      }
      const defense = enemyAttack(check.result);
      if (state.settlement || raid.defeated) return;
      if (check.result === "criticalFailure") playSound("failure", 0.34);
      const health = healthStatus(raid);
      const defenseText = defense ? `\n${defense.narrative}${defense.specialText || ""}\n${rollText(defense.check)}` : "";
      const healthText = health ? `\n${health.title}：${health.message}` : "";
      openEvent(
        check.result === "criticalFailure" ? "战斗大失败" : "交火反馈",
        `${attackStory}\n${rollText(check)}${defenseText}${healthText}\n获得经验 ${xp}。`,
        check.result === "criticalFailure" ? "combat" : check.tone,
        check,
        `<p>${attackStory}</p><p><strong>攻击判定：${checkRuleText(check)}</strong>，本次掷出 <strong>${diceResultText(check)}</strong>。</p>${defense ? `<p>${defense.narrative}${defense.specialText || ""}</p><p><strong>承伤判定：${checkRuleText(defense.check)}</strong>，本次掷出 <strong>${diceResultText(defense.check)}</strong>，受到 <strong>${defense.damage}</strong> 点伤害。</p>` : ""}${health ? `<p><strong>${health.title}：${health.message}</strong></p>` : ""}<p>获得经验 <strong>${xp}</strong>。</p>`
      );
    }

    function enemyAttack(attackResult = "success") {
      const raid = state.raid;
      if (!raid || raid.defeated || !raid.enemy) return null;
      const enemy = raid.enemy;
      enemy.combatTurns = (enemy.combatTurns || 0) + 1;
      const target = defenseTargetFor(raid);
      const check = rollCheck(target);
      raid.rollHistory.unshift({ type: "defense", enemy: enemy.name, ...check });
      const baseDamage = armorReducedDamage(enemy.attack, raid.armor);
      let damage = baseDamage;
      if (check.result === "criticalSuccess") damage = 0;
      else if (check.result === "criticalFailure") damage = Math.max(1, Math.round(baseDamage * 1.35));
      if (attackResult === "criticalFailure") damage += Math.max(1, Math.floor(baseDamage * 0.35));
      let specialText = "";
      if (enemy.boss && enemy.combatTurns % 3 === 0) {
        damage += Math.max(1, Math.floor(armorReducedDamage(24, raid.armor) * 0.75));
        enemy.currentArmor = Math.min(enemy.armor, (enemy.currentArmor ?? enemy.armor) + 20);
        specialText = `\n赛义德发动烟雾与手雷轰炸，护盾恢复至 ${enemy.currentArmor}。`;
      }
      const absorbed = Math.min(raid.damageShield || 0, damage);
      raid.damageShield = Math.max(0, (raid.damageShield || 0) - absorbed);
      damage -= absorbed;
      raid.hp -= damage;
      if (damage > 0) playSound("hit", 0.32);
      if (raid.hp > 0 && raid.hp / raid.maxHp <= 0.4) playSound("health", 0.24);
      const narrative = defenseNarrative(check, enemy.name, damage);
      if (absorbed > 0) specialText += `\n装甲止损板吸收了 ${absorbed} 点伤害。`;
      addLog(`${narrative} ${rollText(check)}${specialText}`);
      if (raid.hp <= 0) {
        playSound("failure", 0.48);
        raid.hp = 0;
        raid.defeated = true;
        const reason = "你在交战中失去行动能力，未能撤离。";
        const defeatText = `${narrative}${specialText}\n本回合受到 ${damage} 点伤害，生命归零。\n你失去行动能力，无法继续搜打撤。`;
        raid.defeatMessage = `${defeatText}\n请确认本回合结果后，再进入行动结算。`;
        openEvent(
          "交战回合结束",
          `${defeatText}\n请确认本回合结果后，再进入行动结算。`,
          "combat",
          check,
          `<p>${narrative}${specialText || ""}</p><p><strong>承伤判定：${checkRuleText(check)}</strong>，本次掷出 <strong>${diceResultText(check)}</strong>。</p><p>本回合受到 <strong>${damage}</strong> 点伤害，生命归零。</p><p><strong>你失去行动能力，无法继续搜打撤。</strong></p>`,
          { type: "settlement", label: "查看行动结算", reason }
        );
      }
      return { check, damage, specialText, narrative };
    }

    function useMedical(type) {
      const raid = state.raid;
      if (!raid || raid.defeated || raid.hp >= raid.maxHp) return;
      if (type === "medkit" && raid.medkits <= 0) return;
      if (type === "bandage" && raid.bandages <= 0) return;
      const baseAmount = type === "medkit" ? 32 : 12;
      const amount = raid.teammate.id === "beemedic" ? baseAmount + 8 : baseAmount;
      if (type === "medkit") raid.medkits -= 1;
      if (type === "bandage") raid.bandages -= 1;
      raid.hp = Math.min(raid.maxHp, raid.hp + amount);
      playSound("health", 0.32);
      addLog(`你使用${type === "medkit" ? "战地医疗包" : "止血带"}，恢复 ${amount} 点生命。`);
      openEvent(
        "医疗生效",
        `${type === "medkit" ? "战地医疗包" : "止血带"}已使用。\n恢复 ${amount} 点生命，当前生命 ${raid.hp}/${raid.maxHp}。`,
        "success"
      );
    }

    function discardRandomLoot(raid, count) {
      const discarded = [];
      for (let index = 0; index < count && raid.inventory.length; index += 1) {
        const discardIndex = Math.floor(Math.random() * raid.inventory.length);
        const [item] = raid.inventory.splice(discardIndex, 1);
        if (!item) continue;
        discarded.push(item);
        raid.lootValue = Math.max(0, raid.lootValue - item.value);
      }
      return discarded;
    }

    function attemptExtract(id) {
      const raid = state.raid;
      const point = (raid?.extractions || []).find((item) => item.id === id);
      if (!raid || raid.defeated || !point) return;
      if (raid.enemy) {
        playSound("failure");
        openEvent("无法启动撤离", "当前区域仍有敌人接触，先结束战斗再尝试撤离。", "combat");
        return;
      }
      if (point.locationId !== raid.currentLocation) {
        playSound("failure");
        const location = data.locations.find((item) => item.id === point.locationId);
        openEvent("撤离点不在当前区域", `请先移动到${location?.name || "对应区域"}，再启动${point.name}。`, "warning");
        return;
      }
      if (point.id === "boss" && !raid.bossDefeated) {
        playSound("failure");
        openEvent("撤离条件未满足", "这是首领专属撤离点。\n击败哈夫克大首领 · 赛义德后，撤离信号才会开放。", "warning");
        return;
      }
      if (point.id === "discard" && raid.inventory.length < 3) {
        playSound("failure");
        openEvent("战利品不足", "应急抛载撤离点需要随机丢弃 3 件战利品。\n当前战利品不足 3 件，暂时无法启动。", "warning");
        return;
      }

      const target = clamp(point.success + (raid.teammate.id === "hackclaw" ? 8 : 0) + (raid.extractBonus || 0), 30, 90);
      const check = rollCheck(target);
      raid.lastExtractionCheck = check;
      raid.rollHistory.unshift({ type: "extract", point: point.name, ...check });
      const xp = grantCheckXp(check, { criticalFailure: 4, failure: 10, success: 20, criticalSuccess: 35 }, "完成撤离判定");
      addLog(`你尝试从${point.name}撤离，${rollText(check)}。`);
      if (check.result === "success" || check.result === "criticalSuccess") {
        playSound("success", 0.42);
        const discarded = point.id === "discard" ? discardRandomLoot(raid, 3) : [];
        const discardedText = discarded.length
          ? `\n随机丢弃：${discarded.map((item) => item.name).join("、")}。`
          : "";
        if (discarded.length) addLog(`应急抛载完成，随机丢弃 ${discarded.length} 件战利品：${discarded.map((item) => item.name).join("、")}。`);
        succeedRaid(point.name);
        openEvent(
          check.result === "criticalSuccess" ? "撤离大成功" : "撤离完成",
          `${rollText(check)}\n你已从${point.name}离开危险区域。${discardedText}\n获得经验 ${xp}，物资已进入仓库。`,
          "success",
          check
        );
      } else {
        playSound("failure", 0.38);
        failRaid(check.result === "criticalFailure" ? "撤离大失败，路线暴露后遭到敌人包围。" : "本次没有离开危险区域，携带物资未能带回。");
        openEvent(
          check.result === "criticalFailure" ? "撤离大失败" : "撤离结果",
          `${rollText(check)}\n本次没有离开危险区域，携带物资未能带回。\n获得经验 ${xp}。`,
          check.result === "criticalFailure" ? "combat" : "info",
          check
        );
      }
    }

    function succeedRaid(pointName) {
      const raid = state.raid;
      const currentLocation = data.locations.find((item) => item.id === raid.currentLocation);
      const xp = 80 + raid.kills * 30 + Math.min(80, Math.floor(raid.lootValue / 500000)) + (currentLocation?.riskLevel || 0) * 10;
      const credits = 300 + raid.kills * 120;
      raid.inventory.forEach((item) => addToStash({ ...item, type: "loot", count: 1 }));
      state.meta.xp += xp;
      state.meta.credits += credits;
      levelUp();
      state.settlement = { success: true, pointName, xp, credits, lootValue: raid.lootValue, kills: raid.kills, inventory: raid.inventory, storedLoot: raid.inventory.length };
      setScreen();
      render();
    }

    function completeFailRaid(reason) {
      const raid = state.raid;
      const insurance = 0;
      state.meta.credits += insurance;
      const xp = Math.max(15, raid.kills * 12);
      state.settlement = { success: false, reason, xp, credits: insurance, lootValue: raid.lootValue, kills: raid.kills, inventory: [], insurance };
      state.meta.xp += state.settlement.xp;
      levelUp();
      setScreen();
      render();
    }

    function failRaid(reason) {
      completeFailRaid(reason);
    }

    function levelUp() {
      if (state.meta.level >= MAX_LEVEL) {
        state.meta.xp = 0;
        return;
      }
      let threshold = xpThreshold(state.meta.level);
      while (state.meta.level < MAX_LEVEL && state.meta.xp >= threshold) {
        state.meta.xp -= threshold;
        state.meta.level += 1;
        const baseStats = levelBaseStats();
        state.meta.stats.maxHp = Math.max(state.meta.stats.maxHp, baseStats.maxHp);
        state.meta.stats.attack = Math.max(state.meta.stats.attack, baseStats.attack);
        state.meta.stats.armor = Math.max(state.meta.stats.armor, baseStats.armor);
        state.meta.statPoints += 5;
        state.meta.levelSpend = { maxHp: 0, attack: 0, armor: 0 };
        state.meta.credits += 500;
        threshold = xpThreshold(state.meta.level);
      }
      if (state.meta.level >= MAX_LEVEL) state.meta.xp = 0;
    }

            ${result.success ? `<div class="callout" style="text-align:left">本局结算入账 ${money(result.credits)}。你可以把经验投入生命、攻击或护甲，下一局直接继承属性成长。</div>` : `<div class="callout" style="text-align:left; border-left-color: var(--red); background: #f2ded8; color: #6b3830">本次行动失败，带出的物资全部损失，但仍会根据战斗和撤离判定获得少量经验。</div>`}
            <div class="button-row" style="justify-content:center">
              <button class="button orange" id="backToPrep">返回局外准备</button>
            </div>
          </div>
        </div>
      `;
      $("#backToPrep").addEventListener("click", () => {
        state.raid = null;
        state.settlement = null;
        setScreen();
        render();
      });
    }

    function render() {
      normalizeLiveTasks();
      if (state.liveTasks.tasks["watch-live"]?.activeUntil) {
        startLiveWatchTicker();
      } else {
        stopLiveWatchTicker();
      }
      renderMeta();
      renderAudioToggle();
      renderPrep();
      renderRaid();
      renderSettlement();
      setScreen();
      syncMusicForScreen();
      renderEvent();
      saveGame();
    }

    document.addEventListener("pointerdown", unlockAudio, { once: true, passive: true });
    document.addEventListener("keydown", unlockAudio, { once: true });
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        stopMusic();
      } else if (!audioState.muted && audioState.unlocked) {
        syncMusicForScreen();
      }
    });
    document.addEventListener("click", (event) => {
      const target = event.target instanceof Element ? event.target.closest("button") : null;
      if (!target || target.disabled) return;
      const actionButton = target.matches(
        "#startRaid, #attackButton, #searchCurrentButton, #scanButton, #eventContinue, #medkitButton, #bandageButton, #giveUpButton, #backToPrep, #openLogButton, [data-travel], [data-extract], [data-use-item], [data-buy-shop], [data-upgrade], [data-select], [data-location], [data-live-task-action], [data-live-task-claim]"
      );
      if (!actionButton) playSound("click", 0.18);
    });
    $("#audioToggle")?.addEventListener("click", toggleAudio);
    loadGame();
    render();
  </script>
</body>
</html>
