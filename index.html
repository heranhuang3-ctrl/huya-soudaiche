<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>虎牙搜打撤 · 零号大坝</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@700;800;900&display=swap');

    :root {
      --ink: #1d211d;
      --muted: #77786d;
      --paper: #f4f0e7;
      --paper-2: #ebe5d8;
      --line: #d6cdbd;
      --olive: #626b48;
      --olive-dark: #39432e;
      --orange: #d76b36;
      --orange-dark: #a94b26;
      --yellow: #d4a83b;
      --red: #a94435;
      --green: #3f7554;
      --shadow: 0 16px 40px rgba(58, 53, 43, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 8%, rgba(215, 107, 54, .14), transparent 27rem),
        linear-gradient(135deg, #f7f3ea 0%, #e6e0d2 100%);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    button, select { font: inherit; }
    button { cursor: pointer; }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 46px;
    }

    .masthead {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      padding: 12px 0 26px;
    }

    .eyebrow {
      color: var(--orange-dark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1, h2, h3, p { margin: 0; }
    h1 {
      max-width: 700px;
      margin-top: 8px;
      font-size: clamp(32px, 6vw, 72px);
      line-height: .94;
      letter-spacing: -.06em;
    }

    .masthead-note {
      max-width: 260px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      text-align: right;
    }

    .topbar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat {
      padding: 14px 16px;
      border: 1px solid var(--line);
      background: rgba(255, 252, 244, .65);
      box-shadow: 0 5px 16px rgba(58, 53, 43, .05);
    }

    .stat-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .stat-value {
      margin-top: 5px;
      font-size: 24px;
      font-weight: 900;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 5px;
      border: 1px solid var(--line);
      background: rgba(255, 252, 244, .64);
    }

    .tab {
      flex: 1;
      border: 0;
      padding: 13px 10px;
      color: var(--muted);
      background: transparent;
      font-weight: 900;
      transition: .2s ease;
    }

    .tab.active {
      color: #fff9ec;
      background: var(--olive-dark);
      box-shadow: 4px 4px 0 rgba(57, 67, 46, .12);
    }
    .tab:disabled {
      cursor: default;
      opacity: 1;
    }
    .tab:not(.active):disabled {
      color: #8d8a7d;
    }

    .screen {
      display: none;
      margin-top: 18px;
    }
    .screen.active { display: block; }

    .grid {
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      gap: 18px;
    }

    .panel {
      border: 1px solid var(--line);
      background: rgba(255, 252, 244, .84);
      box-shadow: var(--shadow);
    }

    .event-modal-root:empty { display: none; }
    .event-modal-root {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(25, 28, 23, .58);
      backdrop-filter: blur(5px);
    }

    .event-modal {
      width: min(560px, 100%);
      border: 1px solid rgba(255, 255, 255, .35);
      background: #fffaf0;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .3);
      animation: modal-in .2s ease-out;
    }

    .event-modal-bar {
      height: 8px;
      background: var(--olive-dark);
    }
    .event-modal.combat .event-modal-bar { background: var(--red); }
    .event-modal.success .event-modal-bar { background: var(--green); }
    .event-modal.warning .event-modal-bar { background: var(--yellow); }

    .event-modal-content { padding: 24px; }
    .event-modal h2 {
      margin-top: 6px;
      font-size: clamp(26px, 5vw, 42px);
      letter-spacing: -.05em;
    }
    .event-modal-message {
      margin-top: 14px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      white-space: pre-line;
    }
    .event-story.pending {
      max-height: 0;
      margin-top: 0;
      overflow: hidden;
      opacity: 0;
    }
    .event-story.revealed {
      max-height: 900px;
      margin-top: 14px;
      opacity: 1;
      transition: max-height .45s ease, margin-top .25s ease, opacity .3s ease;
    }
    .event-modal-message strong { color: var(--ink); font-weight: 900; }
    .roll-card {
      display: block;
      margin-top: 18px;
      padding: 13px 15px;
      border: 1px solid var(--line);
      background: #f1eadc;
    }
    .dice-animation {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 138px;
      overflow: hidden;
      background:
        radial-gradient(circle at center, rgba(240, 163, 78, .18), transparent 58%),
        #101913;
      border: 1px solid rgba(240, 163, 78, .22);
    }
    .dice-roll-video {
      display: block;
      width: min(100%, 220px);
      max-height: 138px;
      object-fit: contain;
      opacity: .96;
      transition: opacity .16s ease, transform .16s ease;
    }
    .dice-roll-video.hidden {
      display: none !important;
    }
    .dice-animation.complete .dice-animation-label {
      opacity: 0;
    }
    .dice-animation.complete {
      min-height: 0;
      border-color: transparent;
      background: transparent;
    }
    .dice-animation-label {
      position: absolute;
      right: 10px;
      bottom: 8px;
      padding: 4px 7px;
      color: #ffd08b;
      background: rgba(8, 14, 10, .7);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .08em;
      transition: opacity .2s ease;
    }
    .dice-final {
      display: flex;
      align-items: center;
      gap: 14px;
      max-height: 0;
      margin-top: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-6px);
      transition: max-height .3s ease, margin-top .3s ease, opacity .3s ease, transform .3s ease;
    }
    .dice-final.revealed {
      max-height: 100px;
      margin-top: 14px;
      opacity: 1;
      transform: translateY(0);
    }
    .roll-number {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      color: #fff9ec;
      background: var(--olive-dark);
      font-size: 25px;
      font-weight: 900;
      animation: dice-pop .45s cubic-bezier(.2, .9, .25, 1.2);
    }
    .roll-card.success .roll-number { background: var(--green); }
    .roll-card.warning .roll-number { background: var(--yellow); color: #3e3215; }
    .roll-card.combat .roll-number { background: var(--red); }
    .roll-meta strong { display: block; font-size: 16px; }
    .roll-meta span { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .dice-pair {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 176px;
    }
    .die {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      color: #fff9ec;
      background: var(--olive-dark);
      border: 1px solid rgba(255, 255, 255, .28);
      border-radius: 7px;
      font-size: 21px;
      font-weight: 900;
      box-shadow: 0 5px 12px rgba(0, 0, 0, .2);
      animation: dice-roll .65s cubic-bezier(.2, .9, .25, 1.2);
    }
    .die-second { animation-delay: .08s; }
    .die-face {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 4px;
      padding: 7px;
    }
    .die-face i {
      display: block;
      width: 7px;
      height: 7px;
      margin: auto;
      border-radius: 50%;
      background: transparent;
    }
    .die-face i.pip {
      background: #fff9ec;
      box-shadow: 0 0 5px rgba(255, 249, 236, .55);
    }
    .roll-card.success .die { background: var(--green); }
    .roll-card.warning .die { background: var(--yellow); color: #3e3215; }
    .roll-card.combat .die { background: var(--red); }
    .dice-sum {
      color: var(--orange);
      font-size: 16px;
      font-weight: 900;
      white-space: nowrap;
      animation: dice-sum-in .55s ease-out .35s both;
    }
    @keyframes dice-roll {
      0% { transform: translateY(-14px) rotate(-22deg) scale(.65); opacity: .2; }
      35% { transform: translateY(5px) rotate(18deg) scale(1.12); opacity: .75; }
      65% { transform: translateY(-3px) rotate(-8deg) scale(.94); opacity: 1; }
      100% { transform: translateY(0) rotate(0) scale(1); }
    }
    @keyframes dice-sum-in {
      from { transform: translateX(-6px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes dice-pop {
      0% { transform: rotate(-14deg) scale(.65); opacity: .3; }
      65% { transform: rotate(8deg) scale(1.08); opacity: 1; }
      100% { transform: rotate(0) scale(1); }
    }
    .event-modal-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 22px;
    }
    @keyframes modal-in {
      from { opacity: 0; transform: translateY(10px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h2 {
      font-size: 19px;
      letter-spacing: -.02em;
    }

    .panel-body { padding: 20px; }

    .section-kicker {
      margin-bottom: 10px;
      color: var(--orange-dark);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .callout {
      padding: 14px 16px;
      border-left: 4px solid var(--orange);
      background: #f8ead8;
      color: #61452e;
      font-size: 13px;
      line-height: 1.55;
    }

    .notice {
      margin-top: 12px;
      padding: 10px 12px;
      border: 1px solid #e2c48e;
      background: #fff2cf;
      color: #72511d;
      font-size: 12px;
      line-height: 1.45;
    }

    .economy-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: #f2ede1;
    }

    .economy-row strong { font-size: 19px; }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .choice {
      min-height: 122px;
      padding: 14px;
      border: 1px solid var(--line);
      background: #faf6ec;
      text-align: left;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .choice:hover { transform: translateY(-2px); }
    .choice.selected {
      border-color: var(--orange);
      background: #fff0df;
      box-shadow: inset 0 0 0 2px rgba(215, 107, 54, .12);
    }

    .choice-title {
      display: block;
      font-weight: 900;
      font-size: 16px;
    }

    .choice-desc {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .shop-card {
      display: flex;
      min-height: 180px;
      flex-direction: column;
      padding: 14px;
      border: 1px solid var(--line);
      background: #faf6ec;
    }
    .shop-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .shop-card-name {
      font-size: 15px;
      font-weight: 900;
    }
    .shop-card-desc {
      min-height: 40px;
      margin-top: 9px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .shop-card-effect {
      margin-top: 8px;
      color: var(--orange-dark);
      font-size: 12px;
      font-weight: 900;
    }
    .shop-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: auto;
      padding-top: 12px;
    }
    .shop-price {
      color: var(--ink);
      font-size: 15px;
      font-weight: 900;
      white-space: nowrap;
    }
    .shop-card .button { padding: 9px 11px; font-size: 11px; }

    .gear-visual {
      display: block;
      width: 100%;
      height: 180px;
      margin-top: 12px;
      border: 1px solid var(--line);
      background: #17221f;
      object-fit: contain;
    }

    .loadout-list, .loot-list, .log-list {
      display: grid;
      gap: 9px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 12px;
      border: 1px solid var(--line);
      background: #f9f5eb;
    }

    .item-main { min-width: 0; }
    .item-name { font-weight: 900; }
    .loot-name {
      font-weight: 900;
    }
    .loot-name.rarity-red { color: #ff7461; }
    .loot-name.rarity-gold { color: #ffd477; }
    .loot-name.rarity-purple { color: #d8a5f0; }
    .loot-name.rarity-blue { color: #81c7ee; }
    .loot-name.rarity-green { color: #80d58f; }
    .loot-name.rarity-white { color: #e3e9e4; }
    .item-meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 4px 7px;
      color: var(--olive-dark);
      background: #e3e8d7;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .tag.orange { color: var(--orange-dark); background: #f6dfc6; }
    .tag.red { color: var(--red); background: #f2d8d2; }
    .tag.gold { color: #745614; background: #f3e2a9; }
    .tag.purple { color: #64427c; background: #e9d8ef; }
    .tag.blue { color: #2b5b7d; background: #d8e8f2; }
    .tag.green { color: #3e6c4d; background: #dcebdc; }
    .tag.white { color: #77786d; background: #e9e7df; }

    .search-loot-results {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }
    .loot-result-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 13px;
      border: 1px solid #30483b;
      border-left-width: 4px;
      background: rgba(24, 35, 29, .82);
    }
    .loot-result-card.rarity-red { border-left-color: #ff7461; }
    .loot-result-card.rarity-gold { border-left-color: #ffd477; }
    .loot-result-card.rarity-purple { border-left-color: #d8a5f0; }
    .loot-result-card.rarity-blue { border-left-color: #81c7ee; }
    .loot-result-card.rarity-green { border-left-color: #80d58f; }
    .loot-result-card.rarity-white { border-left-color: #e3e9e4; }
    .loot-result-main {
      display: grid;
      gap: 4px;
      min-width: 0;
    }
    .loot-rarity {
      color: #91a096;
      font-size: 11px;
    }
    .loot-value {
      color: #f6d789;
      font-size: 15px;
      white-space: nowrap;
    }

    .button {
      border: 0;
      padding: 12px 15px;
      color: #fff9ec;
      background: var(--olive-dark);
      font-weight: 900;
      transition: .2s ease;
    }
    .button:hover:not(:disabled) { background: #293323; transform: translateY(-1px); }
    .button.secondary { color: var(--ink); background: var(--paper-2); }
    .button.orange { background: var(--orange-dark); }
    .button.danger { background: var(--red); }
    .button:disabled { cursor: not-allowed; opacity: .45; }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 18px;
    }

    .raid-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .raid-status {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .raid-stat {
      padding: 12px;
      background: var(--olive-dark);
      color: #fff9ec;
    }
    .raid-stat .stat-label { color: #bfc9ad; }
    .raid-stat .stat-value { font-size: 21px; }

    .progress {
      height: 8px;
      margin-top: 7px;
      overflow: hidden;
      background: #d8d2c3;
    }
    .progress > span { display: block; height: 100%; background: var(--orange); }
    .progress.green > span { background: var(--green); }
    .progress.health-low > span { background: var(--yellow); }
    .progress.health-critical > span { background: var(--red); }

    .health-alert {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
      padding: 12px 15px;
      border: 1px solid #e1b65b;
      background: #fff1c9;
      color: #6b4b18;
      box-shadow: 0 6px 16px rgba(88, 63, 25, .08);
    }
    .health-alert strong { font-size: 14px; }
    .health-alert span { font-size: 12px; }
    .health-alert.critical {
      border-color: #c56551;
      background: #f8ddd4;
      color: #7a3028;
      animation: health-pulse 1.8s ease-in-out infinite;
    }
    @keyframes health-pulse {
      0%, 100% { box-shadow: 0 6px 16px rgba(122, 48, 40, .08); }
      50% { box-shadow: 0 6px 22px rgba(122, 48, 40, .24); }
    }
    .patrol-intel {
      display: grid;
      gap: 3px;
      border-left-color: #ed624e;
      background: rgba(75, 28, 25, .34);
    }
    .patrol-intel strong { color: #ffb29c; }
    .patrol-intel b { color: #ffd477; }
    .patrol-intel small { color: #bba99b; }

    .location-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .map-board {
      position: relative;
      aspect-ratio: 1586 / 992;
      min-height: 0;
      overflow: hidden;
      border: 1px solid #475044;
      background:
        linear-gradient(rgba(62, 74, 57, .25) 1px, transparent 1px),
        linear-gradient(90deg, rgba(62, 74, 57, .25) 1px, transparent 1px),
        radial-gradient(circle at 43% 45%, rgba(97, 111, 77, .6), transparent 24%),
        radial-gradient(circle at 75% 75%, rgba(153, 119, 67, .34), transparent 22%),
        #262d28;
      background-size: 42px 42px, 42px 42px, auto, auto, auto;
      box-shadow: inset 0 0 80px rgba(0, 0, 0, .42);
    }
    .map-board.asset-map {
      background-color: #eef0f1;
      background-image: url("assets/map/zero-dam-route-map.png");
      background-position: center;
      background-repeat: no-repeat;
      background-size: 100% 100%;
      box-shadow: none;
    }
    .map-board.asset-map::before,
    .map-board.asset-map::after,
    .map-board.asset-map + .map-legend {
      display: none;
    }

    .map-board::before,
    .map-board::after {
      position: absolute;
      content: "";
      pointer-events: none;
      border: 1px solid rgba(206, 193, 143, .2);
      border-radius: 48%;
      transform: rotate(-18deg);
    }
    .map-board::before {
      inset: 18% 31% 9% 19%;
      border-width: 0 0 18px 0;
    }
    .map-board::after {
      inset: 8% 4% 37% 45%;
      border-width: 0 0 11px 0;
      transform: rotate(26deg);
    }

    .map-route-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .asset-map .map-route-layer { opacity: 0; }
    .map-route {
      stroke: rgba(221, 211, 170, .38);
      stroke-width: 1.4;
      stroke-dasharray: 4 3;
    }
    .map-route.active {
      stroke: #e0a64e;
      stroke-width: 2.6;
      stroke-dasharray: none;
      filter: drop-shadow(0 0 4px rgba(224, 166, 78, .65));
    }

    .map-node {
      position: absolute;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 88px;
      min-height: 50px;
      padding: 6px 7px;
      border: 1px solid rgba(255, 250, 236, .4);
      color: #fff9ec;
      background: rgba(50, 61, 48, .88);
      box-shadow: 0 7px 16px rgba(0, 0, 0, .32);
      font-size: 10px;
      font-weight: 900;
      line-height: 1.2;
      text-align: center;
      transform: translate(-50%, -50%);
      transition: .18s ease;
    }
    .asset-map .map-node {

    .map-node:disabled { cursor: default; opacity: .75; }
    .map-node.current {
      border-color: #fff0a9;

    .map-node.low { border-color: #76ac73; }
    .map-node.extract-zone {
      border-color: #8ee4ae;

    .map-node.patrol {

      box-shadow: 0 0 0 3px rgba(237, 98, 78, .24), 0 0 18px rgba(237, 98, 78, .28);
    }
    .map-node.patrol.boss {

    .map-node.alerted {
      animation: patrol-alert 1.25s ease-in-out infinite;
    }
    .map-patrol-mark {
      display: block;
      max-width: 100%;
      margin-top: 4px;
      overflow: hidden;
      color: #ffad93;
      font-size: 9px;
      font-weight: 900;
      line-height: 1.1;
      text-overflow: ellipsis;
      white-space: nowrap;

    .map-patrol-mark.boss { color: #ffd477; }
    .map-extract-mark {
      display: block;
      max-width: 100%;
      margin-top: 3px;
      overflow: hidden;
      color: #8ee4ae;
      font-size: 8px;
      font-weight: 900;
      line-height: 1.1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .map-extract-mark.locked { color: #ff9b88; }
    .map-node.extraction-point {
      box-shadow: 0 0 0 2px rgba(142, 228, 174, .2), 0 0 15px rgba(142, 228, 174, .16);
    }
    .map-node.extraction-boss {

    }
    .map-node.extraction-discard {

    }
    .map-extraction-panel {
      display: flex;

      justify-content: space-between;
      gap: 14px;
      margin-top: 14px;
      padding: 13px 15px;
      border: 1px solid rgba(142, 228, 174, .42);
      border-left-width: 4px;
      background: rgba(17, 42, 29, .72);
    }
    .map-extraction-panel > div {
      display: grid;
      gap: 3px;
    }
    .map-extraction-panel strong { color: #b8f4c9; }
    .map-extraction-panel span,
    .map-extraction-panel small { color: #a6b8aa; }
    .map-extraction-panel.extraction-boss {
      border-color: rgba(255, 125, 102, .52);
      background: rgba(67, 28, 25, .7);
    }
    .map-extraction-panel.extraction-boss strong { color: #ffb29c; }
    .map-extraction-panel.extraction-discard {
      border-color: rgba(255, 212, 119, .52);
      background: rgba(66, 50, 22, .7);
    }
    .map-extraction-panel.extraction-discard strong { color: #ffd477; }
    .map-legend .tag.extract-safe { border-color: #8ee4ae; color: #b8f4c9; }
    .map-legend .tag.extract-boss { border-color: #ff7d66; color: #ffb29c; }
    .map-legend .tag.extract-discard { border-color: #ffd477; color: #ffd477; }
    @keyframes patrol-alert {
      0%, 100% { transform: translate(-50%, -50%); }
      50% { transform: translate(-50%, -50%) scale(1.045); }
    }

    .map-node small {
      display: block;
      margin-top: 4px;
      color: rgba(255, 250, 236, .7);
      font-size: 10px;
      font-weight: 700;
    }

    .map-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 11px;
    }
    .map-legend .tag {
      border: 1px solid rgba(255, 255, 255, .15);
      color: #fff9ec;
      background: rgba(50, 61, 48, .8);
    }
    .map-legend .tag.high { border-color: #e16d58; }
    .map-legend .tag.medium { border-color: #ddb14f; }
    .map-legend .tag.low { border-color: #76ac73; }
    .location {
      min-height: 125px;
      padding: 15px;
      border: 1px solid var(--line);
      background: #faf6ec;
      text-align: left;
    }
    .location-title {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-weight: 900;
    }
    .location-desc {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .encounter {
      padding: 16px;
      border: 1px solid #dfb4a3;
      background: #f9e6de;
    }
    .encounter h3 { color: var(--red); }
    .combat-versus {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: stretch;
      gap: 10px;
      margin-top: 14px;
    }
    .combatant {
      min-width: 0;
      padding: 10px;
      border: 1px solid rgba(126, 54, 37, .22);
      background: rgba(255, 250, 240, .64);
    }
    .combatant.enemy {
      border-color: rgba(126, 54, 37, .4);
      background: rgba(255, 239, 232, .75);
    }
    .combatant-title {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      font-weight: 900;
    }
    .combatant-title span:last-child { color: var(--muted); font-size: 10px; }
    .combatant-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin-top: 9px;
      color: var(--muted);
      font-size: 10px;
      text-align: center;
    }
    .combatant-stats strong {
      display: block;
      color: var(--ink);
      font-size: 16px;
    }
    .combat-vs {
      display: grid;
      place-items: center;
      min-width: 34px;
      color: var(--red);
      font-size: 15px;
      font-weight: 900;
    }
    .probability-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .probability-card {
      padding: 10px;
      border: 1px solid rgba(126, 54, 37, .22);
      background: rgba(255, 250, 240, .72);
    }
    .probability-card span,
    .probability-card small {
      display: block;
      color: var(--muted);
      font-size: 10px;
    }
    .probability-card strong {
      display: block;
      margin: 3px 0;
      color: var(--red);
      font-size: 19px;
      letter-spacing: -.03em;
    }
    .combat-nudge {
      margin-top: 10px;
      padding: 9px 10px;
      border-left: 3px solid var(--orange);
      background: rgba(255, 248, 224, .72);
      color: #6b4b18;
      font-size: 12px;
      line-height: 1.5;
    }
    .combat-nudge.critical {
      border-left-color: var(--red);
      background: rgba(248, 221, 212, .8);
      color: #7a3028;
    }
    .enemy-visual {
      display: block;
      width: min(100%, 260px);
      aspect-ratio: 1;
      object-fit: cover;
      margin: 14px auto 16px;
      border: 1px solid rgba(126, 54, 37, .35);
      background: #302e27;
      box-shadow: 0 8px 18px rgba(74, 38, 27, .16);
    }

    .log {
      min-height: 270px;
      max-height: 390px;
      overflow: auto;
      padding: 14px;
      background: #282c25;
      color: #e4e3d4;
    }
    .log-list { gap: 8px; }
    .log-list li {
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(228, 227, 212, .12);
      font-size: 13px;
      line-height: 1.45;
    }
    .log-list li:last-child { border-bottom: 0; }
    .log-time { color: #e1ae58; font-weight: 900; }

    .result {
      display: grid;
      gap: 14px;
      text-align: center;
    }
    .result-icon {
      display: grid;
      place-items: center;
      width: 72px;
      height: 72px;
      margin: 2px auto 4px;
      border-radius: 50%;
      color: #fff9ec;
      background: var(--green);
      font-size: 34px;
      font-weight: 900;
    }
    .result-icon.failed { background: var(--red); }
    .result h2 { font-size: 34px; }
    .result p { color: var(--muted); line-height: 1.6; }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      text-align: left;
    }
    .summary-card {
      padding: 13px;
      border: 1px solid var(--line);
      background: #faf6ec;
    }
    .summary-card strong { display: block; margin-top: 4px; font-size: 21px; }

    .empty {
      padding: 26px 14px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 820px) {
      .masthead { align-items: flex-start; flex-direction: column; }
      .masthead-note { max-width: none; text-align: left; }
      .grid, .raid-layout { grid-template-columns: 1fr; }
      .topbar { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 560px) {
      .shell { width: min(100% - 20px, 1180px); padding-top: 15px; }
      .choice-grid, .location-grid, .summary-grid, .shop-grid { grid-template-columns: 1fr; }
      .raid-status { grid-template-columns: repeat(2, 1fr); }
      .map-board { min-height: 430px; }
      .map-node { width: 88px; min-height: 50px; padding: 6px; font-size: 10px; }
      .tabs { position: sticky; top: 0; z-index: 3; }
      .panel-body, .panel-head { padding: 15px; }
      .combat-versus { grid-template-columns: 1fr; }
      .combat-vs { min-height: 22px; }
      .probability-grid { grid-template-columns: 1fr; }
      .health-alert { align-items: flex-start; flex-direction: column; gap: 4px; }
    }

    /* Tactical broadcast skin: keep the game readable while giving combat moments more presence. */
    :root {
      --ink: #e8eee8;
      --muted: #8d9b93;
      --paper: #101713;
      --paper-2: #18231d;
      --line: #30433a;
      --olive: #607b5d;
      --olive-dark: #17271f;
      --orange: #f0a34e;
      --orange-dark: #d87832;
      --yellow: #e2c45d;
      --red: #ed624e;
      --green: #65b982;
      --shadow: 0 18px 48px rgba(0, 0, 0, .3);
    }

    body {
      position: relative;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 4%, rgba(240, 163, 78, .13), transparent 25rem),
        radial-gradient(circle at 88% 26%, rgba(67, 156, 144, .1), transparent 30rem),
        linear-gradient(rgba(118, 149, 129, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(118, 149, 129, .035) 1px, transparent 1px),
        #0b100d;
      background-size: auto, auto, 34px 34px, 34px 34px, auto;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }
    body::before {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      content: "";
      background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .018) 0, rgba(255, 255, 255, .018) 1px, transparent 1px, transparent 4px);
      mix-blend-mode: screen;
      opacity: .35;

      position: relative;
      z-index: 1;
      padding-top: 24px;
    }
    .masthead {
      position: relative;
      padding: 18px 22px 27px;
      border: 1px solid #30483b;
      background: linear-gradient(120deg, rgba(23, 39, 31, .96), rgba(14, 22, 18, .9));
      box-shadow: 0 14px 38px rgba(0, 0, 0, .24), inset 0 1px 0 rgba(255, 255, 255, .05);
      overflow: hidden;
    }
    .masthead::before {
      position: absolute;
      inset: 0;
      pointer-events: none;
      content: "";
      background: linear-gradient(90deg, transparent 0 70%, rgba(240, 163, 78, .1) 70% 70.2%, transparent 70.2%);

    .masthead::after {
      position: absolute;
      right: 20px;
      bottom: 12px;
      color: rgba(240, 163, 78, .38);

      font-weight: 900;

      .masthead-note {
        font-size: 12px;
        line-height: 1.45;
      }
      .topbar {
        gap: 6px;
        margin-top: 10px;
      }
      .stat {
        padding: 10px;
      }
      .stat-value {
        font-size: 19px;
      }
      .tabs {
        gap: 4px;
        padding: 4px;
      }
      .tab {
        padding: 11px 6px;
        font-size: 12px;
      }
      .screen {
        margin-top: 12px;
      }
      .panel-head {
        gap: 8px;
        padding: 13px 14px;
      }
      .panel-head h2 {
        font-size: 16px;
      }
      .panel-body {
        padding: 14px;
      }
      .raid-status {
        gap: 6px;
        margin-bottom: 12px;
      }
      .raid-stat {
        padding: 10px;
      }
      .raid-stat .stat-value {
        font-size: 17px;
      }
      .map-board {
        min-height: 390px;
      }
      .map-node {
        width: 76px;
        min-height: 46px;
        padding: 5px 4px;
        font-size: 9px;
      }
      .asset-map .map-node {
        width: 72px;
        min-height: 42px;
        font-size: 9px;
      }
      .map-node small {
        margin-top: 2px;
        font-size: 8px;
      }
      .map-extraction-panel {
        align-items: stretch;
        flex-direction: column;
      }
      .map-extraction-panel .button {
        width: 100%;
      }
      .button-row {
        display: grid;
        grid-template-columns: 1fr;
      }
      .button-row .button {
        width: 100%;
      }
      .event-modal-root {
        padding: 9px;
      }
      .event-modal-content {
        padding: 17px 15px;
      }
      .event-modal h2 {
        font-size: 30px;
      }
      .event-modal-message {
        font-size: 14px;
      }
      .roll-card {
        gap: 10px;
        padding: 10px;
      }
      .roll-number {
        width: 50px;
        height: 50px;
        font-size: 22px;
      }
      .dice-pair {
        min-width: 0;
        gap: 5px;
      }
      .die {
        width: 40px;
        height: 40px;
        font-size: 18px;
      }
      .dice-sum {
        font-size: 14px;
      }
      .log-modal-list {
        max-height: 55vh;
      }
      .log-toggle {
        min-height: 44px;
      }
      .raid-bottom-buttons {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 380px) {
      .topbar {
        grid-template-columns: 1fr 1fr;
      }
      .stat-label {
        font-size: 9px;
      }
      .stat-value {
        font-size: 17px;
      }
      .raid-stat .stat-label {
        letter-spacing: .04em;
      }
      .map-board {
        min-height: 360px;
      }
      .map-node {
        width: 68px;
        min-height: 42px;
        font-size: 8px;
      }
    }

    /* UI UX Pro Max pass: tactical broadcast HUD, mobile-first spacing, and clearer action hierarchy. */
    :root {
      --hud-bg: #080d0c;
      --hud-surface: #101917;
      --hud-surface-raised: #15211d;
      --hud-surface-hot: #1c2821;
      --hud-line: rgba(151, 190, 162, .2);
      --hud-line-strong: rgba(240, 163, 78, .58);
      --hud-text: #edf4ec;
      --hud-muted: #8fa096;
      --hud-amber: #f0a34e;
      --hud-amber-hot: #ffd477;
      --hud-cyan: #6dd6c8;
      --hud-green: #72d08b;
      --hud-red: #ef6a55;
      --hud-blue: #79bce8;
      --hud-radius: 4px;
      --hud-display: "Orbitron", "Arial Narrow", "Microsoft YaHei", sans-serif;
      --hud-mono: "JetBrains Mono", "Cascadia Mono", "Microsoft YaHei", monospace;
    }

    html {
      min-width: 320px;
      background: var(--hud-bg);
      scroll-behavior: smooth;
    }

    body {
      min-height: 100dvh;
      color: var(--hud-text);
      background:
        radial-gradient(circle at 50% -12%, rgba(240, 163, 78, .18), transparent 34rem),
        radial-gradient(circle at 100% 45%, rgba(109, 214, 200, .08), transparent 30rem),
        linear-gradient(rgba(123, 166, 139, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(123, 166, 139, .035) 1px, transparent 1px),
        var(--hud-bg);
      background-size: auto, auto, 32px 32px, 32px 32px, auto;
      font-family: var(--hud-mono);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body::before {
      opacity: .22;
      background:
        linear-gradient(90deg, transparent 0 49.8%, rgba(240, 163, 78, .06) 49.8% 50%, transparent 50%),
        repeating-linear-gradient(0deg, rgba(255, 255, 255, .022) 0, rgba(255, 255, 255, .022) 1px, transparent 1px, transparent 5px);
    }

    button {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible {
      outline: 2px solid var(--hud-amber-hot);
      outline-offset: 3px;
    }

    .shell {
      width: min(1240px, calc(100% - 28px));
      padding: 20px 0 54px;
    }

    .masthead {
      min-height: 208px;
      align-items: flex-start;
      padding: clamp(20px, 4vw, 38px);
      border: 1px solid var(--hud-line);
      border-top: 2px solid var(--hud-amber);
      border-radius: var(--hud-radius);
      background:
        linear-gradient(125deg, rgba(28, 46, 37, .96), rgba(8, 15, 12, .94) 70%),
        radial-gradient(circle at 90% 0%, rgba(240, 163, 78, .24), transparent 18rem);
      box-shadow:
        0 18px 56px rgba(0, 0, 0, .36),
        inset 0 1px 0 rgba(255, 255, 255, .08),
        inset 0 -80px 120px rgba(0, 0, 0, .14);
      isolation: isolate;
    }

    .masthead::before {
      background:
        linear-gradient(90deg, transparent 0 71%, rgba(240, 163, 78, .16) 71% 71.12%, transparent 71.12%),
        linear-gradient(0deg, transparent 0 76%, rgba(109, 214, 200, .12) 76% 76.12%, transparent 76.12%);
      opacity: .9;
    }

    .masthead::after {
      right: 24px;
      bottom: 20px;
      color: rgba(240, 163, 78, .55);
      font-family: var(--hud-mono);
      font-size: 10px;
      letter-spacing: .18em;
    }

    .masthead > div,
    .masthead-note {
      position: relative;
      z-index: 1;
    }

    .eyebrow,
    .section-kicker,
    .stat-label {
      font-family: var(--hud-mono);
      letter-spacing: .16em;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--hud-amber);
    }

    .eyebrow::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--hud-amber);
      box-shadow: 0 0 12px var(--hud-amber);
      content: "";
      animation: hud-pulse 1.8s ease-in-out infinite;
    }

    h1 {
      margin-top: 16px;
      color: var(--hud-text);
      font-family: var(--hud-display);
      font-size: clamp(38px, 7vw, 78px);
      font-weight: 900;
      letter-spacing: -.06em;
      line-height: .92;
      text-shadow: 0 0 34px rgba(240, 163, 78, .16);
    }

    .masthead-note {
      max-width: 310px;
      margin-top: 8px;
      color: #a9b8ad;
      font-family: var(--hud-mono);
      font-size: 12px;
      line-height: 1.8;
      text-align: right;
    }

    .topbar {
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 12px 0;
    }

    .stat {
      position: relative;
      min-height: 76px;
      padding: 13px 14px;
      border: 1px solid var(--hud-line);
      border-radius: var(--hud-radius);
      background: rgba(14, 24, 19, .92);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04), 0 8px 18px rgba(0, 0, 0, .16);
      overflow: hidden;
    }

    .stat::after {
      position: absolute;
      right: 8px;
      bottom: 7px;
      width: 32px;
      height: 2px;
      background: var(--hud-amber);
      box-shadow: 0 0 10px rgba(240, 163, 78, .48);
      content: "";
      opacity: .7;
    }

    .stat-label {
      color: var(--hud-muted);
      font-size: 10px;
    }

    .stat-value {
      margin-top: 8px;
      color: var(--hud-text);
      font-family: var(--hud-display);
      font-size: clamp(17px, 2.5vw, 24px);
      letter-spacing: -.04em;
    }

    .tabs {
      position: sticky;
      top: 10px;
      z-index: 8;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--hud-line);
      border-radius: var(--hud-radius);
      background: rgba(7, 13, 10, .9);
      box-shadow: 0 12px 26px rgba(0, 0, 0, .26);
      backdrop-filter: blur(14px);
    }

    .tab {
      min-height: 48px;
      color: #85978a;
      font-family: var(--hud-mono);
      font-size: 12px;
      letter-spacing: .04em;
    }

    .tab.active {
      color: #181b14;
      background: linear-gradient(135deg, var(--hud-amber-hot), var(--hud-amber));
      box-shadow: 0 0 22px rgba(240, 163, 78, .22);
    }

    .screen {
      margin-top: 14px;
    }

    .grid {
      grid-template-columns: minmax(0, 1.32fr) minmax(280px, .68fr);
      gap: 14px;
    }

    .panel {
      border: 1px solid var(--hud-line);
      border-radius: var(--hud-radius);
      background: linear-gradient(145deg, rgba(17, 28, 22, .97), rgba(10, 17, 13, .95));
      box-shadow: 0 18px 44px rgba(0, 0, 0, .24), inset 0 1px 0 rgba(255, 255, 255, .04);
    }

    .panel-head {
      min-height: 62px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--hud-line);
      background: linear-gradient(90deg, rgba(240, 163, 78, .05), transparent 65%);
    }

    .panel-head h2 {
      color: var(--hud-text);
      font-family: var(--hud-display);
      font-size: 17px;
      letter-spacing: -.03em;
    }

    .panel-body {
      padding: clamp(16px, 2vw, 22px);
    }

    .section-kicker {
      color: var(--hud-amber);
      font-size: 10px;
    }

    .callout {
      border-left-width: 3px;
      border-left-color: var(--hud-amber);
      background: linear-gradient(105deg, rgba(104, 62, 30, .34), rgba(25, 41, 32, .6));
      color: #d7e1d5;
      font-size: 12px;
      line-height: 1.65;
    }

    .choice,
    .shop-card,
    .item-row,
    .location,
    .summary-card {
      border-color: var(--hud-line);
      border-radius: var(--hud-radius);
      background: rgba(19, 31, 25, .8);
    }

    .choice,
    .location {
      min-height: 132px;
      transition: border-color .18s ease, background .18s ease, transform .18s ease, box-shadow .18s ease;
    }

    .choice:hover:not(:disabled),
    .location:hover:not(:disabled),
    .shop-card:hover {
      border-color: var(--hud-line-strong);
      background: rgba(37, 48, 35, .92);
      box-shadow: 0 0 24px rgba(240, 163, 78, .1);
    }

    .choice:active:not(:disabled),
    .location:active:not(:disabled),
    .button:active:not(:disabled) {
      transform: scale(.985);
    }

    .choice.selected {
      border-color: var(--hud-amber);
      background: linear-gradient(145deg, rgba(115, 65, 31, .62), rgba(39, 41, 27, .72));
      box-shadow: inset 0 0 0 1px rgba(255, 212, 119, .18), 0 0 24px rgba(240, 163, 78, .13);
    }

    .choice-title,
    .shop-card-name,
    .item-name {
      color: var(--hud-text);
      font-family: var(--hud-display);
      font-size: 14px;
      letter-spacing: -.02em;
    }

    .choice-desc,
    .shop-card-desc,
    .location-desc,
    .item-meta {
      color: var(--hud-muted);
      line-height: 1.55;
    }

    .tag {
      border: 1px solid rgba(147, 189, 161, .2);
      border-radius: 2px;
      color: #b8ceb9;
      background: rgba(82, 125, 92, .18);
      font-family: var(--hud-mono);
      font-size: 10px;
      letter-spacing: .06em;
    }

    .tag.orange {
      color: var(--hud-amber-hot);
      background: rgba(189, 112, 44, .2);
    }

    .tag.red {
      color: #ffb19d;
      background: rgba(168, 50, 42, .22);
    }

    .tag.gold {
      color: #ffe19a;
      background: rgba(171, 129, 45, .2);
    }

    .tag.blue {
      color: #a8d9f6;
      background: rgba(62, 121, 161, .2);
    }

    .button {
      min-height: 44px;
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 3px;
      padding: 11px 15px;
      font-family: var(--hud-mono);
      font-size: 12px;
      letter-spacing: .02em;
      transition: background .18s ease, border-color .18s ease, box-shadow .18s ease, transform .18s ease, opacity .18s ease;
    }

    .button:hover:not(:disabled) {
      border-color: rgba(255, 212, 119, .56);
      box-shadow: 0 0 22px rgba(240, 163, 78, .22), 0 7px 18px rgba(0, 0, 0, .24);
    }

    .button.orange {
      color: #21180e;
      background: linear-gradient(135deg, var(--hud-amber-hot), var(--hud-amber));
    }

    .button.secondary {
      color: #e8f1e7;
      background: linear-gradient(135deg, #26382d, #18251e);
    }

    .button.danger {
      color: #fff4ed;
      background: linear-gradient(135deg, #c54d42, #7c2e2b);
    }

    .button:disabled {
      filter: saturate(.35);
      opacity: .42;
    }

    .economy-row,
    .raid-bottom-tools {
      border-color: var(--hud-line);
      border-radius: var(--hud-radius);
      background: linear-gradient(100deg, rgba(30, 47, 35, .84), rgba(13, 22, 17, .72));
    }

    .gear-visual {
      height: 168px;
      border-color: var(--hud-line);
      border-radius: 3px;
      background: radial-gradient(circle, rgba(86, 151, 129, .22), rgba(7, 16, 12, .94));
      box-shadow: inset 0 0 32px rgba(109, 214, 200, .08);
    }

    .raid-status {
      gap: 8px;
      margin-bottom: 12px;
    }

    .raid-stat {
      min-height: 88px;
      border: 1px solid rgba(109, 214, 200, .18);
      border-radius: var(--hud-radius);
      background: linear-gradient(140deg, #1a3328, #0f2119);
      box-shadow: inset 0 0 24px rgba(101, 185, 130, .06);
    }

    .raid-stat .stat-value {
      font-family: var(--hud-display);
    }

    .progress {
      height: 9px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .42);
    }

    .progress > span {
      border-radius: inherit;
      box-shadow: 0 0 10px currentColor;
    }

    .progress:not(.green):not(.health-low):not(.health-critical) > span {
      color: var(--hud-amber);
    }

    .progress.green > span {
      color: var(--hud-green);
    }

    .map-board {
      min-height: 420px;
      border-color: rgba(109, 214, 200, .34);
      border-radius: 5px;
      box-shadow: inset 0 0 90px rgba(0, 0, 0, .62), 0 0 26px rgba(61, 137, 116, .1);
    }

    .map-node {
      min-height: 52px;
      border-color: rgba(240, 163, 78, .52);
      border-radius: 3px;
      background: rgba(8, 18, 13, .9);
      box-shadow: 0 7px 16px rgba(0, 0, 0, .36);
      font-family: var(--hud-mono);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, filter .18s ease;
    }

    .map-node.current {
      border-color: var(--hud-amber-hot);
      background: linear-gradient(145deg, rgba(133, 78, 34, .96), rgba(55, 38, 20, .92));
      box-shadow: 0 0 0 3px rgba(240, 163, 78, .2), 0 0 28px rgba(240, 163, 78, .35);
    }

    .map-node.patrol {
      border-color: var(--hud-red);
      box-shadow: 0 0 0 3px rgba(239, 106, 85, .18), 0 0 22px rgba(239, 106, 85, .28);
    }

    .map-node.patrol.boss {
      border-color: var(--hud-amber-hot);
      box-shadow: 0 0 0 3px rgba(255, 212, 119, .2), 0 0 24px rgba(239, 106, 85, .32);
    }

    .map-legend {
      gap: 6px;
    }

    .map-legend .tag {
      background: rgba(11, 24, 16, .84);
    }

    .encounter {
      border: 1px solid rgba(239, 106, 85, .7);
      border-radius: 4px;
      background:
        linear-gradient(135deg, rgba(80, 26, 24, .84), rgba(15, 18, 15, .94)),
        repeating-linear-gradient(0deg, transparent 0 15px, rgba(239, 106, 85, .05) 15px 16px);
      box-shadow: 0 0 0 1px rgba(239, 106, 85, .1), 0 0 34px rgba(239, 106, 85, .14), inset 0 1px 0 rgba(255, 255, 255, .07);
    }

    .encounter::before {
      top: 14px;
      right: 18px;
      color: #ffb19d;
      font-family: var(--hud-mono);
      letter-spacing: .16em;
    }

    .encounter h3 {
      color: #ffd0c3;
      font-family: var(--hud-display);
      font-size: 20px;
      text-shadow: 0 0 18px rgba(239, 106, 85, .32);
    }

    .combat-versus {
      gap: 8px;
      margin-top: 16px;
    }

    .combatant {
      border-color: rgba(151, 190, 162, .22);
      border-radius: 3px;
      background: rgba(10, 22, 15, .72);
    }

    .combatant.enemy {
      border-color: rgba(239, 106, 85, .44);
      background: rgba(53, 24, 23, .72);
    }

    .combatant-title {
      color: #eaf4e8;
      font-family: var(--hud-mono);
    }

    .combatant-stats strong,
    .combat-health-head strong {
      color: #fff4e1;
      font-family: var(--hud-display);
    }

    .combat-vs {
      min-width: 42px;
      color: var(--hud-amber-hot);
      font-family: var(--hud-display);
      text-shadow: 0 0 14px rgba(255, 212, 119, .4);
    }

    .enemy-visual {
      border-color: rgba(239, 106, 85, .4);
      border-radius: 3px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, .28), 0 0 22px rgba(239, 106, 85, .12);
    }

    .health-alert {
      border-radius: 3px;
      box-shadow: 0 0 18px rgba(240, 163, 78, .14);
    }

    .health-alert.critical {
      box-shadow: 0 0 24px rgba(239, 106, 85, .24);
    }

    .event-modal-root {
      padding: 14px;
      background: rgba(1, 5, 3, .82);
      backdrop-filter: blur(12px);
    }

    .event-modal {
      max-height: min(92dvh, 720px);
      overflow: auto;
      border: 1px solid rgba(240, 163, 78, .55);
      border-radius: 5px;
      background: linear-gradient(145deg, rgba(18, 31, 24, .98), rgba(8, 15, 11, .98));
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .04), 0 24px 90px rgba(0, 0, 0, .68), 0 0 38px rgba(240, 163, 78, .14);
    }

    .event-modal-bar {
      height: 5px;
      background: linear-gradient(90deg, var(--hud-amber), var(--hud-amber-hot), transparent);
    }

    .event-modal.combat .event-modal-bar {
      background: linear-gradient(90deg, var(--hud-red), #ffb19d, transparent);
    }

    .event-modal.success .event-modal-bar {
      background: linear-gradient(90deg, var(--hud-green), #c8f6d0, transparent);
    }

    .event-modal-content {
      padding: clamp(20px, 4vw, 32px);
    }

    .event-modal h2 {
      color: var(--hud-text);
      font-family: var(--hud-display);
      letter-spacing: -.05em;
    }

    .event-modal-message {
      color: #b5c4b8;
      line-height: 1.75;
    }

    .roll-card {
      border-color: rgba(109, 214, 200, .26);
      border-radius: 4px;
      background: linear-gradient(135deg, rgba(22, 44, 34, .96), rgba(11, 21, 16, .94));
    }

    .dice-animation {
      min-height: 128px;
      border-radius: 3px;
      background:
        radial-gradient(circle at 50% 50%, rgba(240, 163, 78, .2), transparent 52%),
        linear-gradient(135deg, #0b1510, #17261d);
    }

    .dice-final {
      align-items: center;
    }

    .roll-number,
    .die {
      border-radius: 3px;
      font-family: var(--hud-display);
    }

    .dice-sum {
      color: var(--hud-amber-hot);
      font-family: var(--hud-display);
    }

    .result {
      padding: 34px 20px;
    }

    .result-icon {
      border-radius: 6px;
      color: #151a14;
      background: linear-gradient(135deg, var(--hud-green), #b9f0c7);
      box-shadow: 0 0 26px rgba(114, 208, 139, .22);
    }

    .result-icon.failed {
      color: #fff3ec;
      background: linear-gradient(135deg, #ca5749, #7c2e2b);
    }

    .result h2 {
      font-family: var(--hud-display);
    }

    .summary-card strong {
      color: var(--hud-amber-hot);
      font-family: var(--hud-display);
    }

    @keyframes hud-pulse {
      0%, 100% { opacity: .7; transform: scale(.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }

    @media (max-width: 820px) {
      .shell {
        width: min(100% - 20px, 760px);
      }

      .masthead {
        min-height: 0;
      }

      .masthead-note {
        max-width: 100%;
        text-align: left;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .grid > aside {
        order: 2;
      }

    /* Game UI Frontend + Frontend Design pass: make the game world the primary surface,
       not a generic dashboard of equal-weight cards. */
    :root {
      --terminal-void: #060a09;
      --terminal-panel: #0d1713;
      --terminal-panel-raised: #14221a;
      --terminal-ink: #edf4e9;
      --terminal-muted: #8ba095;
      --terminal-amber: #f3ae55;
      --terminal-amber-soft: #ffd37b;
      --terminal-teal: #65d0c0;
      --terminal-red: #ef6a55;
      --terminal-line: rgba(155, 196, 169, .18);
      --terminal-display: "Barlow Condensed", "Arial Narrow", "Microsoft YaHei", sans-serif;
      --terminal-body: "IBM Plex Sans", "Microsoft YaHei", sans-serif;
      --terminal-mono: "IBM Plex Mono", "Cascadia Mono", "Microsoft YaHei", monospace;
    }

    body {
      color: var(--terminal-ink);
      background:
        radial-gradient(circle at 12% -8%, rgba(243, 174, 85, .14), transparent 25rem),
        radial-gradient(circle at 100% 42%, rgba(101, 208, 192, .08), transparent 26rem),
        linear-gradient(90deg, rgba(255, 255, 255, .025) 1px, transparent 1px),
        linear-gradient(rgba(255, 255, 255, .02) 1px, transparent 1px),
        var(--terminal-void);
      background-size: auto, auto, 40px 40px, 40px 40px, auto;
      font-family: var(--terminal-body);
    }

    body::before {
      opacity: .18;
      background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .03) 0 1px, transparent 1px 5px);
    }

    .shell {
      width: min(1280px, calc(100% - 32px));
      padding-top: 16px;
    }

    .masthead {
      min-height: 168px;
      align-items: stretch;
      padding: clamp(18px, 3vw, 30px);
      border: 1px solid var(--terminal-line);
      border-top: 2px solid var(--terminal-amber);
      border-radius: 3px;
      background:
        linear-gradient(120deg, rgba(18, 37, 27, .98), rgba(7, 14, 11, .96) 74%),
        radial-gradient(circle at 90% 0%, rgba(243, 174, 85, .2), transparent 20rem);
      box-shadow: 0 18px 48px rgba(0, 0, 0, .34), inset 0 1px 0 rgba(255, 255, 255, .06);
    }

    .masthead::before {
      background:
        linear-gradient(90deg, transparent 0 71%, rgba(243, 174, 85, .18) 71% 71.12%, transparent 71.12%),
        linear-gradient(0deg, transparent 0 78%, rgba(101, 208, 192, .12) 78% 78.12%, transparent 78.12%);
    }

    .masthead::after {
      right: 24px;
      bottom: 16px;
      color: rgba(243, 174, 85, .5);
      font-family: var(--terminal-mono);
      letter-spacing: .13em;
    }

    .masthead > div {
      position: relative;
      z-index: 1;
    }

    .brand-lockup {
      display: grid;
      align-content: start;
      gap: 10px;
    }

    .brand-caption {
      color: #93a99b;
      font-family: var(--terminal-body);
      font-size: 12px;
      letter-spacing: .04em;
    }

    .masthead-brief {

      justify-items: end;
      gap: 9px;

    .brief-readout {

    /* Final netgame visual pass: make the interface read as an extraction-shooter HUD. */
    :root {
      --game-void: #030708;
      --game-surface: #0a1110;
      --game-surface-2: #101b18;
      --game-surface-3: #172820;
      --game-line: rgba(157, 194, 171, .2);
      --game-line-hot: rgba(248, 180, 83, .7);
      --game-text: #eff7ee;
      --game-muted: #8ea69a;
      --game-gold: #f4b35d;
      --game-gold-hot: #ffe0a0;
      --game-teal: #69d8c5;
      --game-danger: #f06757;
      --game-danger-hot: #ffb1a1;
      --game-display: "Barlow Condensed", "Arial Narrow", "Microsoft YaHei", sans-serif;
      --game-mono: "IBM Plex Mono", "Cascadia Mono", "Microsoft YaHei", monospace;
      --game-radius: 6px;
    }

    html {
      background: var(--game-void);
    }

    body {
      position: relative;
      color: var(--game-text);
      background:
        radial-gradient(circle at 12% 0%, rgba(244, 179, 93, .16), transparent 25rem),
        radial-gradient(circle at 88% 24%, rgba(105, 216, 197, .12), transparent 28rem),
        linear-gradient(135deg, rgba(255, 255, 255, .025) 25%, transparent 25% 50%, rgba(255, 255, 255, .018) 50% 75%, transparent 75%),
        var(--game-void);
      background-size: auto, auto, 120px 120px, auto;
      font-family: var(--game-mono);
    }

    body::after {
      position: fixed;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      content: "";
      opacity: .12;
      background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .07) 0 1px, transparent 1px 4px);
      mix-blend-mode: screen;
    }

    .shell {
      width: min(1360px, calc(100% - 34px));
      padding: 18px 0 58px;
    }

    .masthead {
      position: relative;
      min-height: 244px;
      overflow: hidden;
      border: 1px solid var(--game-line);
      border-top: 3px solid var(--game-gold);
      border-radius: var(--game-radius);
      background:
        linear-gradient(120deg, rgba(18, 38, 29, .97), rgba(5, 12, 11, .97) 64%),
        radial-gradient(circle at 90% 0%, rgba(244, 179, 93, .24), transparent 22rem);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .48), inset 0 1px 0 rgba(255, 255, 255, .08);
      isolation: isolate;
    }

    .masthead::before {
      position: absolute;
      inset: 0;
      z-index: -1;
      content: "";
      opacity: .8;
      background:
        linear-gradient(90deg, transparent 0 63%, rgba(105, 216, 197, .14) 63% 63.12%, transparent 63.12%),
        linear-gradient(0deg, transparent 0 72%, rgba(244, 179, 93, .18) 72% 72.12%, transparent 72.12%),
        linear-gradient(135deg, transparent 0 67%, rgba(255, 255, 255, .045) 67% 67.15%, transparent 67.15%);
    }

    .masthead::after {
      position: absolute;
      right: 24px;
      bottom: 18px;
      color: rgba(244, 179, 93, .55);
      content: "EXTRACTION COMMAND // 00-01";
      font-size: 10px;
      letter-spacing: .18em;
    }

    .masthead > div {
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      color: var(--game-gold);
      font-family: var(--game-mono);
      font-size: 11px;
      letter-spacing: .18em;
    }

    .eyebrow::before {
      width: 8px;
      height: 8px;
      background: var(--game-danger);
      box-shadow: 0 0 14px var(--game-danger);
    }

    h1 {
      color: var(--game-text);
      font-family: var(--game-display);
      font-size: clamp(48px, 8vw, 92px);
      font-weight: 900;
      letter-spacing: -.065em;
      text-shadow: 0 0 34px rgba(244, 179, 93, .18);
    }

    .brand-caption {
      color: #a8beb0;
      font-family: var(--game-mono);
      letter-spacing: .04em;
    }

    .masthead-brief {
      align-self: stretch;
      justify-content: space-between;
      min-width: 250px;
    }

    .brief-readout {
      padding: 10px 12px;
      border: 1px solid rgba(240, 103, 87, .42);
      background: rgba(66, 22, 20, .48);
      color: #ffd2c6;
      box-shadow: 0 0 20px rgba(240, 103, 87, .1);
      font-family: var(--game-mono);
      letter-spacing: .08em;
    }

    .brief-dot {
      background: var(--game-danger);
      box-shadow: 0 0 12px var(--game-danger);
    }

    .masthead-note {
      color: var(--game-muted);
      font-family: var(--game-mono);
      line-height: 1.75;
    }

    .topbar {
      gap: 8px;
      margin: 12px 0 10px;
    }

    .stat {
      min-height: 82px;
      overflow: hidden;
      border: 1px solid var(--game-line);
      border-radius: var(--game-radius);
      background: linear-gradient(145deg, rgba(17, 32, 25, .98), rgba(7, 14, 12, .98));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), 0 12px 24px rgba(0, 0, 0, .2);
    }

    .stat::before {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      content: "";
      background: var(--game-teal);
      box-shadow: 0 0 12px rgba(105, 216, 197, .32);
    }

    .stat:nth-child(4)::before {
      background: var(--game-gold);
      box-shadow: 0 0 12px rgba(244, 179, 93, .32);
    }

    .stat-label {
      color: var(--game-muted);
      font-family: var(--game-mono);
      letter-spacing: .14em;
    }

    .stat-value {
      color: var(--game-text);
      font-family: var(--game-display);
      font-size: clamp(20px, 2.8vw, 28px);
    }

    .tabs {
      top: 8px;
      padding: 5px;
      border: 1px solid var(--game-line);
      border-radius: var(--game-radius);
      background: rgba(3, 9, 7, .92);
      box-shadow: 0 14px 30px rgba(0, 0, 0, .34);
      backdrop-filter: blur(14px);
    }

    .tab {
      position: relative;
      min-height: 50px;
      color: #778e82;
      font-family: var(--game-mono);
      letter-spacing: .03em;
    }

    .tab.active {
      color: #23170d;
      background: linear-gradient(135deg, var(--game-gold-hot), var(--game-gold));
      box-shadow: 0 0 24px rgba(244, 179, 93, .24);
    }

    .tab.active::after {
      position: absolute;
      right: 10px;
      bottom: 6px;
      width: 22px;
      height: 2px;
      content: "";
      background: rgba(35, 23, 13, .64);
    }

    .screen.active {
      animation: screen-in .35s ease both;
    }

    @keyframes screen-in {
      from { opacity: .4; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .panel {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--game-line);
      border-radius: var(--game-radius);
      background: linear-gradient(145deg, rgba(14, 28, 21, .98), rgba(6, 13, 11, .97));
      box-shadow: 0 22px 50px rgba(0, 0, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .05);
    }

    .panel::before {
      position: absolute;
      right: 0;
      top: 0;
      width: 120px;
      height: 1px;
      content: "";
      background: linear-gradient(90deg, transparent, var(--game-gold));
      opacity: .7;
    }

    .panel-head {
      min-height: 68px;
      padding: 17px 20px;
      border-bottom: 1px solid var(--game-line);
      background: linear-gradient(90deg, rgba(244, 179, 93, .1), transparent 62%);
    }

    .panel-head h2,
    .result h2,
    .encounter h3 {
      color: var(--game-text);
      font-family: var(--game-display);
      letter-spacing: -.025em;
    }

    .section-kicker {
      color: var(--game-gold);
      font-family: var(--game-mono);
      letter-spacing: .16em;
    }

    .callout {
      border-left-color: var(--game-gold);
      background: linear-gradient(105deg, rgba(112, 67, 29, .38), rgba(20, 39, 29, .72));
      color: #d8e7da;
    }

    .choice,
    .location,
    .shop-card,
    .item-row,
    .summary-card {
      border: 1px solid var(--game-line);
      border-radius: var(--game-radius);
      background: linear-gradient(145deg, rgba(22, 39, 29, .92), rgba(10, 19, 15, .9));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .03);
    }

    .choice:hover:not(:disabled),
    .location:hover:not(:disabled),
    .shop-card:hover {
      border-color: var(--game-line-hot);
      background: linear-gradient(145deg, rgba(54, 49, 29, .94), rgba(19, 31, 23, .94));
      box-shadow: 0 0 24px rgba(244, 179, 93, .14);
    }

    .choice.selected {
      border-color: var(--game-gold-hot);
      background: linear-gradient(145deg, rgba(109, 64, 29, .74), rgba(34, 37, 24, .9));
      box-shadow: inset 0 0 0 1px rgba(255, 224, 160, .22), 0 0 26px rgba(244, 179, 93, .18);
    }

    .choice-title,
    .shop-card-name,
    .item-name {
      color: var(--game-text);
      font-family: var(--game-display);
      font-size: 16px;
    }

    .choice-desc,
    .shop-card-desc,
    .location-desc,
    .item-meta {
      color: var(--game-muted);
    }

    .tag {
      border-color: rgba(157, 194, 171, .28);
      border-radius: 3px;
      color: #c4d8c7;
      background: rgba(93, 146, 108, .16);
      font-family: var(--game-mono);
    }

    .tag.orange,
    .tag.gold {
      border-color: rgba(244, 179, 93, .55);
      color: var(--game-gold-hot);
      background: rgba(183, 113, 40, .2);
    }

    .tag.red {
      border-color: rgba(240, 103, 87, .62);
      color: var(--game-danger-hot);
      background: rgba(155, 43, 37, .22);
    }

    .button {
      min-height: 46px;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 4px;
      font-family: var(--game-mono);
      transition: filter .18s ease, border-color .18s ease, box-shadow .18s ease, transform .18s ease;
    }

    .button::after {
      display: inline-block;
      margin-left: 9px;
      color: currentColor;
      content: "↗";
      opacity: .45;
    }

    .button:hover:not(:disabled) {
      border-color: var(--game-gold-hot);
      filter: brightness(1.08);
      box-shadow: 0 0 24px rgba(244, 179, 93, .24), 0 8px 20px rgba(0, 0, 0, .24);
    }

    .button.orange {
      color: #24180c;
      background: linear-gradient(135deg, var(--game-gold-hot), var(--game-gold));
    }

    .button.secondary {
      color: var(--game-text);
      background: linear-gradient(135deg, #294335, #14251b);
    }

    .button.danger {
      color: #fff2ed;
      background: linear-gradient(135deg, #ce5849, #792b2a);
    }

    #raidScreen > .raid-status {
      border: 1px solid rgba(105, 216, 197, .22);
      border-radius: var(--game-radius);
      background: rgba(3, 12, 9, .9);
      box-shadow: 0 14px 30px rgba(0, 0, 0, .32);
    }

    #raidScreen > .raid-status .raid-stat {
      border: 1px solid rgba(105, 216, 197, .2);
      border-radius: 4px;
      background: linear-gradient(145deg, rgba(28, 62, 45, .95), rgba(9, 27, 18, .96));
    }

    #raidScreen > .raid-layout > section.panel {
      border-top: 2px solid rgba(105, 216, 197, .7);
    }

    #raidScreen .map-board {
      min-height: 540px;
      border: 1px solid rgba(105, 216, 197, .46);
      border-radius: var(--game-radius);
      box-shadow: inset 0 0 110px rgba(0, 0, 0, .7), 0 0 32px rgba(61, 137, 116, .14);
    }

    #raidScreen .map-board::after {
      content: "LIVE SATELLITE FEED // ZERO DAM";
      position: absolute;
      left: 14px;
      top: 12px;
      color: rgba(184, 238, 215, .82);
      font-family: var(--game-mono);
      font-size: 9px;
      letter-spacing: .12em;
      pointer-events: none;
    }

    .map-node {
      min-height: 56px;
      border: 1px solid rgba(244, 179, 93, .6);
      border-radius: 4px;
      background: rgba(4, 14, 10, .92);
      box-shadow: 0 8px 18px rgba(0, 0, 0, .4);
      font-family: var(--game-mono);
    }

    .map-node.current {
      border-color: var(--game-gold-hot);
      background: linear-gradient(145deg, rgba(143, 82, 31, .98), rgba(53, 36, 19, .95));
      box-shadow: 0 0 0 3px rgba(244, 179, 93, .24), 0 0 34px rgba(244, 179, 93, .4);
    }

    .map-node.patrol {
      border-color: var(--game-danger);
      box-shadow: 0 0 0 3px rgba(240, 103, 87, .18), 0 0 26px rgba(240, 103, 87, .35);
    }

    .map-node.patrol.boss {
      border-color: var(--game-gold-hot);
      box-shadow: 0 0 0 3px rgba(255, 224, 160, .2), 0 0 30px rgba(240, 103, 87, .38);
    }

    .map-node.alerted {
      animation: danger-pulse 1.25s ease-in-out infinite;
    }

    @keyframes danger-pulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.25); }
    }

    .encounter {
      border: 1px solid rgba(240, 103, 87, .8);
      border-radius: var(--game-radius);
      background:
        linear-gradient(135deg, rgba(86, 26, 23, .9), rgba(7, 13, 10, .96)),
        repeating-linear-gradient(0deg, transparent 0 15px, rgba(240, 103, 87, .06) 15px 16px);
      box-shadow: 0 0 0 1px rgba(240, 103, 87, .14), 0 0 38px rgba(240, 103, 87, .2);
    }

    .encounter h3 {
      color: #ffd1c6;
      font-size: 28px;
      text-shadow: 0 0 20px rgba(240, 103, 87, .36);
    }

    .combatant {
      border-color: rgba(157, 194, 171, .24);
      border-radius: 4px;
      background: rgba(4, 16, 10, .78);
    }

    .combatant.enemy {
      border-color: rgba(240, 103, 87, .5);
      background: rgba(59, 22, 21, .78);
    }

    .combatant-title,
    .combatant-stats strong,
    .combat-health-head strong,
    .combat-vs {
      font-family: var(--game-display);
    }

    .combat-vs,
    .dice-sum {
      color: var(--game-gold-hot);
      text-shadow: 0 0 16px rgba(255, 224, 160, .42);
    }

    .event-modal-root {
      background: rgba(1, 5, 4, .87);
      backdrop-filter: blur(15px);
    }

    .event-modal {
      border: 1px solid rgba(244, 179, 93, .72);
      border-radius: var(--game-radius);
      background: linear-gradient(145deg, rgba(18, 34, 25, .99), rgba(4, 11, 8, .99));
      box-shadow: 0 0 0 1px rgba(255, 255, 255, .04), 0 28px 100px rgba(0, 0, 0, .8), 0 0 44px rgba(244, 179, 93, .2);
    }

    .event-modal h2 {
      font-family: var(--game-display);
      font-size: clamp(30px, 5vw, 48px);
    }

    .event-modal-message {
      color: #bdd0c1;
    }

    .roll-card {
      border-color: rgba(105, 216, 197, .34);
      border-radius: 5px;
      background: linear-gradient(135deg, rgba(25, 54, 41, .98), rgba(8, 19, 14, .96));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05);
    }

    .result-icon {
      border-radius: 8px;
      font-family: var(--game-display);
      box-shadow: 0 0 30px rgba(114, 208, 139, .28);
    }

    .live-task-panel {
      overflow: hidden;
      border-top: 2px solid var(--game-teal);
    }

    .live-task-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .live-task-card {
      display: flex;
      min-height: 232px;
      flex-direction: column;
      gap: 10px;
      padding: 15px;
      border: 1px solid var(--game-line);
      border-radius: var(--game-radius);
      background:
        linear-gradient(145deg, rgba(27, 48, 35, .94), rgba(10, 19, 15, .92)),
        repeating-linear-gradient(0deg, transparent 0 5px, rgba(255, 255, 255, .018) 6px);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .035);
    }

    .live-task-card.done {
      border-color: rgba(114, 208, 139, .48);
      background: linear-gradient(145deg, rgba(31, 67, 45, .94), rgba(10, 25, 17, .94));
    }

    .live-task-top,
    .live-task-reward,
    .live-task-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .live-task-top {
      align-items: flex-start;
    }

    .live-task-icon {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      place-items: center;
      border: 1px solid rgba(244, 179, 93, .35);
      border-radius: 4px;
      color: var(--game-gold-hot);
      background: rgba(244, 179, 93, .12);
      font-family: var(--game-mono);
      font-size: 17px;
    }

    .live-task-title {
      color: var(--game-text);
      font-family: var(--game-display);
      font-size: 16px;
      font-weight: 800;
    }

    .live-task-desc {
      min-height: 42px;
      color: var(--game-muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .live-task-progress {
      height: 7px;
      overflow: hidden;
      border: 1px solid rgba(105, 216, 197, .2);
      border-radius: 2px;
      background: rgba(4, 13, 9, .82);
    }

    .live-task-progress span {
      display: block;
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--game-teal), var(--game-gold-hot));
      box-shadow: 0 0 12px rgba(105, 216, 197, .36);
      transition: width .25s ease;
    }

    .live-task-progress-label {
      color: var(--game-muted);
      font-family: var(--game-mono);
      font-size: 10px;
    }

    .live-task-reward {
      justify-content: flex-start;
      color: var(--game-gold-hot);
      font-family: var(--game-mono);
      font-size: 11px;
    }

    .live-task-actions {
      margin-top: auto;
      align-items: stretch;
    }

    .live-task-actions .button,
    .live-task-actions a {
      flex: 1;
      min-width: 0;
      padding: 9px 8px;
      text-align: center;
      font-size: 10px;
      text-decoration: none;
    }

    .live-task-note {
      margin-top: 12px;
      color: var(--game-muted);
      font-family: var(--game-mono);
      font-size: 10px;
      line-height: 1.55;
    }

    @media (max-width: 760px) {
      .shell {
        width: calc(100% - 16px);
        padding-top: 8px;
      }

      .masthead {
        min-height: 0;
        padding: 19px 15px 22px;
      }

      .masthead-brief {
        min-width: 0;
        margin-top: 18px;
      }

      .masthead-note {
        text-align: left;
      }

      .masthead::after {
        display: none;
      }

      h1 {
        font-size: clamp(45px, 15vw, 68px);
      }

      .topbar {
        grid-template-columns: repeat(2, 1fr);
      }

      .stat {
        min-height: 70px;
        padding: 10px 11px;
      }

      .stat-value {
        font-size: 20px;
      }

      .tabs {
        top: 5px;
      }

      .tab {
        min-height: 46px;
        padding: 9px 4px;
        font-size: 10px;
      }

      #raidScreen .map-board {
        min-height: 410px;
      }

      .map-node {
        min-height: 46px;
      }

      .live-task-grid {
        grid-template-columns: 1fr;
      }

      .live-task-card {
        min-height: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .screen.active,
      .map-node.alerted {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div class="brand-lockup">
        <div class="eyebrow"><span class="eyebrow-code">HD / 01</span> Huya live ops · Zero Dam</div>
        <h1>虎牙搜打撤</h1>
        <div class="brand-caption">一局一条路线 · 一次撤离 · 一场直播间战术</div>
      </div>
      <div class="masthead-brief">
        <div class="brief-readout"><span class="brief-dot"></span><strong>LIVE</strong><span>行动频道在线</span></div>
        <button class="audio-toggle" id="audioToggle" type="button" aria-pressed="false">声音：开</button>
        <p class="masthead-note">零号大坝行动频道<br>带出的是物资，留下的是成长。</p>
      </div>
    </header>

    <section class="topbar" id="metaBar" aria-live="polite"></section>

    <nav class="tabs" aria-label="游戏阶段">
      <button class="tab active" data-screen="prep">局外准备</button>
      <button class="tab" data-screen="raid">行动中</button>
      <button class="tab" data-screen="settle">行动结算</button>
    </nav>

    <section class="screen active" id="prepScreen"></section>
    <section class="screen" id="raidScreen"></section>
    <section class="screen" id="settleScreen"></section>
    <div class="event-modal-root" id="eventModalRoot"></div>
  </main>

  <script>
    const data = {

        { id: "beemedic", name: "蜂医", desc: "支援型干员。额外携带一次医疗资源，使用医疗物资时恢复量提升。", bonus: "生存优势" },
        { id: "hackclaw", name: "骇爪", desc: "侦察型干员。进入新区域时更容易发现敌人和高品质物资。", bonus: "情报优势" }

      ],
      locations: [
        { id: "dam-gate", name: "大坝外围", risk: "低风险", desc: "新手进入零号大坝的外围区域，适合观察路线。", value: 320, riskLevel: 0, position: [8, 82], neighbors: ["west-road", "waterworks", "river-platform", "visitor-center", "extract-west"] },
        { id: "west-road", name: "西侧公路", risk: "低风险", desc: "连接外围与厂区的快速通道，物资不多但路线开阔。", value: 420, riskLevel: 0, position: [18, 66], neighbors: ["dam-gate", "cement-factory", "waterworks", "quarry-yard", "extract-west"] },
        { id: "cement-factory", name: "水泥厂", risk: "中风险", desc: "厂房和仓储区连片，工业材料与弹药较多。", value: 780, riskLevel: 1, position: [18, 47], neighbors: ["west-road", "barracks", "waterworks", "quarry-yard"] },
        { id: "quarry-yard", name: "采石场", risk: "低风险", desc: "废弃采石作业区，藏有零散工业物资和旧设备。", value: 560, riskLevel: 0, position: [34, 57], neighbors: ["west-road", "cement-factory", "waterworks", "small-barracks", "power-station"] },

      const step = musicState.step++;
      const beat = 60 / track.bpm;
      const melody = track.melody[step % track.melody.length];
      const bass = track.bass[step % track.bass.length];
      synthTone(melody, mode === "raid" ? beat * 0.58 : beat * 0.86, track.volume, track.type);
      synthTone(bass, beat * 0.92, track.volume * 1.35, mode === "raid" ? "square" : "triangle");
      if (mode === "raid" && step % 2 === 0) {
        synthTone(melody * 2, beat * 0.18, track.volume * 0.52, "square", beat * 0.18);
      }
    }

    function stopMusic() {
      if (musicState.timer) {
        window.clearInterval(musicState.timer);
        musicState.timer = null;
      }
      if (musicState.gain && musicState.context) {
        const oldGain = musicState.gain;
        const now = musicState.context.currentTime;
        oldGain.gain.cancelScheduledValues(now);
        oldGain.gain.setTargetAtTime(0.0001, now, 0.08);
        window.setTimeout(() => {
          try {
            oldGain.disconnect();
          } catch {}
        }, 350);
      }
      musicState.gain = null;
      musicState.activeMode = null;
      musicState.step = 0;
    }

    function startMusic(mode) {
      if (audioState.muted || !audioState.unlocked || !musicTracks[mode]) return;
      const context = ensureMusicContext();
      if (!context) return;
      if (musicState.activeMode === mode && musicState.timer) return;
      stopMusic();
      const track = musicTracks[mode];
      musicState.activeMode = mode;
      musicState.gain = context.createGain();
      musicState.gain.gain.setValueAtTime(0.0001, context.currentTime);
      musicState.gain.gain.exponentialRampToValueAtTime(0.72, context.currentTime + 0.55);
      musicState.gain.connect(context.destination);
      scheduleMusicStep(mode);
      musicState.timer = window.setInterval(() => scheduleMusicStep(mode), 60000 / track.bpm);
    }

    function syncMusicForScreen() {
      if (audioState.muted || !audioState.unlocked) return;
      startMusic(flowScreen() === "raid" ? "raid" : "prep");
    }
